<body><div id="platform-root"></div><div id="tour-bar"></div><div id="guide-root" class="guide-layer"></div><div class="stage"><main class="phone" id="phone"><div id="screen" style="display:contents"></div><div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div></main></div>
<script>
'use strict';
const QUESTIONS=['我的预算是1000元左右，喜欢知性风的大衣。','伊芙丽和太平鸟哪个好？','我希望多了解伊芙丽大衣。'];
const NOTES=[{id:'guide',title:'预算1000元羊毛大衣推荐',short:'预算1000元羊毛大衣推荐',author:'番茄 momo',initial:'番',tag:'选购指南',ad:false},{id:'compare',title:'姐妹们，太平鸟和伊芙丽哪家的大衣质量好',short:'太平鸟和伊芙丽哪家的大衣质量好',author:'女汉子也会伤',initial:'女',tag:'冬装讨论',ad:false},{id:'brand',title:'大衣选购的五大逻辑｜伊芙丽大衣',short:'伊芙丽大衣选购指南',author:'天才小嘉',initial:'嘉',tag:'选购指南',ad:true}];
let state={turns:[],draft:QUESTIONS[0],view:'chat',mode:'host',hostAsked:false,note:null,scroll:0,saved:new Set(),closedAd:false,events:[],why:false,unsupported:false,revision:0};let timer;let observer;let exposureTimer;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={back:'<path d="m14 5-7 7 7 7"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',edit:'<path d="M12 5H5v14h14v-7M11 13l2-5 5-5 3 3-5 5-5 2Z"/>',send:'<path d="M12 19V5m-6 6 6-6 6 6"/>',save:'<path d="M6 4h12v17l-6-4-6 4z"/>',like:'<path d="M20 9c0-5-6-7-8-3-3-4-9-2-9 3 0 4 9 10 9 10s8-6 8-10Z"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V4H4v11h4"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',down:'<path d="m7 10 5 5 5-5"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>'};
function icon(name,size=20){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.more}</svg>`}
function sprout(){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21V12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 13C5 14 3 9 4 5c5-1 10 2 8 8Z" fill="currentColor" opacity=".8"/><path d="M12 11c0-6 5-9 9-8 0 6-3 10-9 8Z" fill="currentColor"/></svg>'}
function featureBadge(){return '<span class="mode-badge">'+sprout()+'种草官</span>'}
function appHeader(agent=false){if(experience==='preview')return previewHeaderHTML();return `<header class="top"><button class="icon-btn" type="button" data-action="history" aria-label="对话记录与入口">${icon('more')}</button><div class="identity">${eyes()}<b>点点</b><span class="ai-tag">ai</span>${agent?featureBadge():''}</div><button class="icon-btn" type="button" data-action="reset" aria-label="新对话">${icon('edit')}</button></header>`}
function entryCard(inline=false){return `<button class="feature-entry ${inline?'host-inline':''}" type="button" data-action="enter"><span class="new">新上线</span><span class="feature-title"><span class="mode-logo">${sprout()}</span>点点种草官</span><p>帮你找攻略、比选择，读懂心仪品牌。</p><span class="enter">点击体验 ${icon('arrow',14)}</span></button>`}
function hostHTML(){return `${appHeader()}<div class="feed" id="feed">${state.hostAsked?`<section class="host-question"><div class="user"><div class="user-bubble">${QUESTIONS[0]}</div></div><div class="assistant-title">${eyes()}点点<span class="ai-tag">ai</span></div><div class="answer">可以先看版型、面料与试穿体验，再缩小候选范围。</div>${entryCard(true)}</section>`:`<section class="host-home"><div class="host-greeting"><div class="hero-icon"><i></i><i></i></div><h1>你好，<br>想探索些什么？</h1></div>${entryCard()}</section>`}</div>${composer()}`}
function invite(){sheet('点点种草官','<div class="invite"><div class="invite-symbol">'+sprout()+'</div><h3>点点种草官！</h3><p>帮你找攻略、比选择，读懂心仪品牌。</p><div class="invite-actions"><button type="button" data-action="decline">暂不使用</button><button type="button" class="accept" data-action="accept">确定，开始选购</button></div></div>');$('.sheet').classList.add('invite-sheet');$('.sheet>h2').remove();$('.sheet>.wide').remove();}
function enterCopilot(){closeSheet();state.mode='agent';state.view='chat';if(state.hostAsked&&!state.turns.length){state.turns.push({id:state.revision++,stage:0,question:QUESTIONS[0]});emit('进入种草官',NOTES[0],'普通对话邀请');}else emit('进入种草官',null,'首页独立入口');state.draft=QUESTIONS[firstMissing()]||'';render();requestAnimationFrame(()=>{if(state.turns.length)document.querySelector('[data-turn="'+(firstMissing()-1)+'"]')?.scrollIntoView({block:'start'})});}
function eyes(){return '<span class="tiny-eyes" aria-hidden="true"><i></i><i></i></span>'}
function noteArt(type){return `<img class="native-thumb ${type==='brand'?'portrait':''}" src="${NOTE_IMAGES[type]}" alt="${esc(NOTES.find(n=>n.id===type).short)}笔记封面" decoding="async">`}
function classify(text){if(/伊芙丽/.test(text)&&/太平鸟/.test(text))return 1;if(/伊芙丽/.test(text)&&/了解|看看|介绍|多看|想看|大衣|品牌/.test(text))return 2;if(/1000|1,000|一千/.test(text)&&/知性|大衣/.test(text))return 0;return -1}
function firstMissing(){return [0,1,2].find(i=>!state.turns.some(t=>t.stage===i))??3}
function textAnswer(stage){if(stage===0)return '<p>1000 元左右、知性风，可以先看看<strong>选购攻略与通勤穿搭</strong>，再挑感兴趣的品牌。</p>';if(stage===1)return '<p>先看两家<strong>大衣的讨论</strong>，再核对版型、材质和适合自己的搭配。</p>';return '<p>可以从<strong>版型、材质、颜色、长度和工艺</strong>了解伊芙丽大衣，这篇选购指南可以展开看看。</p>'}
function emit(type,n,detail=''){state.events.push({type,note:n?.id||null,detail,time:new Date().toISOString()})}
function card(stage){return groupedCards(stage)}
function composer(){if(experience==='preview')return tourFooterHTML();const host=state.mode==='host',done=!host&&firstMissing()===3;if(done)return '<footer class="composer-zone"><div class="completed-compose"><span>继续查看上方笔记</span><button type="button" data-action="reset">新对话</button></div></footer>';const draft=host?QUESTIONS[0]:state.draft;return `<footer class="composer-zone"><div class="composer" id="composer"><textarea id="question" aria-label="对话问题" maxlength="180" rows="2" ${host||firstMissing()===0?'readonly':''}>${esc(draft)}</textarea><button class="send" type="button" data-action="send" aria-label="发送问题">${icon('send',21)}</button></div></footer>`}
function chatHTML(){return `${appHeader(true)}<div class="feed" id="feed">${state.turns.length?state.turns.map((t,i)=>`<article class="round" id="turn-${t.id}" data-turn="${t.stage}">${i?'<div class="turn-divider"></div>':''}<div class="user"><div class="user-bubble">${esc(t.question)}</div></div><div class="assistant-title">${eyes()}点点 ${featureBadge()}</div><div class="answer">${textAnswer(t.stage)}</div>${card(t.stage)}<div class="turn-end"><button type="button" data-copy="${t.stage}" aria-label="复制第${t.stage+1}轮回答">${icon('copy',14)}</button><button type="button" data-action="about" aria-label="关于本演示">${icon('more',16)}</button></div></article>`).join(''):`<div class="agent-empty"><div class="invite-symbol">${sprout()}</div><h2>点点种草官</h2><p>帮你找攻略、比选择，读懂心仪品牌。</p></div>`}${firstMissing()===3?'<div class="done-actions"><button type="button" data-review="0">回看选购指南</button><button type="button" data-review="1">回看品牌对比</button></div>':''}</div>${composer()}`}

function detailHTML(n){const dims=n.id==='guide'?{w:2004,h:1484,split:1110}:{w:1452,h:1083,split:805};const image=NOTE_IMAGES[n.id];return `<div class="detail native-detail" id="detail" aria-label="${esc(n.title)}${n.id==='compare'?'示例改编':'截图'}">${n.id==='brand'||n.id==='look'?`<img class="native-portrait" src="${image}" alt="${n.id==='brand'?'用户提供的大衣选购指南长图，可上下滑动阅读；图内控件仅为截图':'用户提供的大衣穿搭视频截图，仅供阅读，不播放视频'}" decoding="async">`:`<div class="native-slice" style="aspect-ratio:${dims.split}/${dims.h}"><img src="${image}" style="width:${dims.w/dims.split*100}%" alt="${esc(n.title)}笔记封面" decoding="async"></div><div class="native-slice" style="aspect-ratio:${dims.w-dims.split}/${dims.h}"><img src="${image}" style="width:${dims.w/(dims.w-dims.split)*100}%;left:-${dims.split/(dims.w-dims.split)*100}%" alt="${esc(n.title)}笔记正文、作者与互动信息；图内控件仅为截图" decoding="async"></div>`}</div><footer class="native-return"><button type="button" data-action="back">${icon('back',16)}回到点点种草</button></footer>`}
function render(){hideMetricHelp();hideChartTooltip();if(observer)observer.disconnect();clearTimeout(exposureTimer);for(const t of adViewTimers.values())clearTimeout(t);adViewTimers.clear();const business=['platform','home','report'].includes(experience);document.body.classList.toggle('platform-mode',business);document.body.classList.toggle('preview-mode',experience==='preview');$('#platform-root').innerHTML=experience==='platform'?platformHTML():experience==='home'?homeHTML():experience==='report'?reportHTML():'';$('#tour-bar').innerHTML=experience==='preview'?tourBarHTML():'';if(business){$('#screen').innerHTML='';scheduleGuidance();return}$('#screen').innerHTML=state.view==='note'?detailHTML(NOTES.find(n=>n.id===state.note)):state.mode==='host'?hostHTML():chatHTML();if(experience==='preview')document.querySelector('[data-turn="'+tour.stage+'"]')?.classList.add('current-preview-turn');if(state.view==='chat'){const t=$('#question');if(t){t.addEventListener('input',()=>{if(state.mode==='agent'){state.draft=t.value;$('.send').disabled=!t.value.trim()}});t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});}observeAd();}scheduleGuidance();}
function send(){if(state.mode==='host'){state.hostAsked=true;state.draft=QUESTIONS[0];render();emit('普通对话提问',null,QUESTIONS[0]);invite();return;}const question=$('#question')?.value.trim()||state.draft.trim();if(!question)return;const stage=classify(question);if(stage<0){toast('请使用本轮预填的选购问题');state.draft=QUESTIONS[firstMissing()]||'';render();return}const expected=firstMissing();if(stage>expected){toast('先完成当前问题');return}const existing=state.turns.find(t=>t.stage===stage);if(existing){state.draft=QUESTIONS[expected]||'';render();requestAnimationFrame(()=>document.querySelector('[data-turn="'+stage+'"]').scrollIntoView({block:'start'}));return}$('#question')?.blur();state.turns.push({id:state.revision++,stage,question});state.unsupported=false;state.draft=QUESTIONS[firstMissing()]||'';emit('发送问题',NOTES[stage],question);render();requestAnimationFrame(()=>document.getElementById('turn-'+(state.revision-1)).scrollIntoView({block:'start'}));}
function openNote(id,paid=null,stage=null){const n=NOTES.find(n=>n.id===id);if(!n)return;state.draft=$('#question')?.value??state.draft;state.scroll=$('#feed')?.scrollTop||0;state.lastPlacement={noteId:id,source:paid===true?'paid':paid===false?'organic':n.ad?'paid':'organic',stage};state.view='note';state.note=id;emit('打开笔记',n,state.lastPlacement.source==='paid'?'推广入口打开，未计费':'自然入口打开');Object.assign(state.events.at(-1),state.lastPlacement);history.pushState({note:id},'','#note-'+id);render();}

function performanceReadingBenchmark(){const rates=performanceRows(reportSettings.range).map(r=>reportTotals([r]).readRate).filter(v=>v!==null&&Number.isFinite(v)).sort((a,b)=>a-b),n=rates.length;return {count:n,median:n<2?null:n%2?rates[(n-1)/2]:(rates[n/2-1]+rates[n/2])/2};}
function performanceDiagnostics(rows){const benchmark=performanceReadingBenchmark();return rows.map(r=>{const n=NOTES.find(n=>n.id===r.id),t=reportTotals([r]),low=benchmark.median!==null&&t.readRate!==null&&t.readRate<benchmark.median,high=benchmark.median!==null&&t.readRate!==null&&t.readRate>benchmark.median;return {id:r.id,name:n.short,issue:low?'有效阅读率低于同类笔记中位数':high?'有效阅读率高于同类笔记中位数':'有效阅读率暂无明显差异',evidence:`${reportN(t.clicks)} 次点击带来 ${reportN(t.reads)} 次有效阅读，阅读率 ${reportFormat(t.readRate,'readRate')}。`,comparison:benchmark.median===null?'当前可比笔记不足，暂不做对照判断。':`对照：本计划 ${benchmark.count} 篇大衣笔记，阅读率中位数 ${reportFormat(benchmark.median,'readRate')}（演示）。`,action:low?'封面与开头补充价格区间、版型和通勤场景，测试是否更贴合当前选购问题。':'保留选购要点，结合有效阅读与互动成本，尝试新的封面或开头并观察变化。'}})}

function performanceModalHTML(){const type=performanceState.modal,d=performanceState.draft;if(!type||!d)return '';const budget=type==='budget',n=!budget&&NOTES.find(n=>n.id===type);return `<div class="b-modal-backdrop"><section class="perf-edit-dialog" role="dialog" aria-modal="true" aria-label="${budget?'调整计划预算':'调整笔记投放'}"><header><h2>${budget?'调整计划预算':n.short}</h2><button type="button" data-b-action="perf-close-edit" aria-label="关闭调整">×</button></header><p class="perf-edit-intro">${budget?'统一调整计划日预算，系统匹配合适的选购对话。':'调整这篇笔记的投放状态、目标成本或优化备注。'}</p>${budget?`<label class="native-field"><span class="b-label">日预算 ${metricHelp('daily')}</span><div class="native-money"><span>¥</span><input type="number" min="0.01" step="0.01" data-perf-edit="daily" aria-label="调整日预算" value="${esc(d.daily)}"><span>元 / 天</span></div></label>`:`<label class="native-field"><span class="b-label">笔记投放状态</span><select data-perf-edit="active" aria-label="笔记投放状态"><option value="on" ${d.active?'selected':''}>继续投放</option><option value="off" ${!d.active?'selected':''}>暂停笔记</option></select></label><label class="native-field"><span class="b-label">互动目标成本 ${metricHelp('bid')}</span><div class="native-money"><span>¥</span><input type="number" min="0.01" step="0.01" data-perf-edit="bid" aria-label="笔记互动目标成本" placeholder="沿用计划出价" value="${esc(d.bid)}"><span>元 / 次</span></div></label><label class="native-field"><span class="b-label">优化备注</span><textarea data-perf-edit="memo" aria-label="优化备注" maxlength="300" placeholder="记录下一版封面、开头或内容的调整方向">${esc(d.memo)}</textarea></label>`}<p class="perf-edit-error" id="perf-edit-error" role="status"></p><small class="perf-edit-note">仅模拟设置，不改变历史数据，也不修改原笔记。</small><footer><button type="button" data-b-action="perf-close-edit">取消</button><button type="button" class="b-primary" data-b-action="perf-save-edit">保存调整（模拟）</button></footer></section></div>`}
function performanceHTML(){const rows=selectedPerformanceRows(),t=reportTotals(rows),ended=performanceState.mode==='ended';return `${navHeaderHTML('data')}<div class="report-layout">${performanceSidebarHTML()}<main class="report-main"><section class="report-heading perf-heading"><div class="report-heading-top"><h1>标准投报表</h1><label class="report-date-control"><span>区间</span><select aria-label="数据时间范围" data-report-filter="range"><option value="7" ${reportSettings.range==='7'?'selected':''}>近 7 天</option><option value="30" ${reportSettings.range==='30'?'selected':''}>近 30 天</option></select></label><button type="button" class="export-report" data-b-action="export-report">导出 CSV ↓</button></div><div class="perf-tabs"><span>广告账户</span><span>广告计划</span><span>广告创意</span><b>笔记/素材</b><span>关键词</span><span>直播间</span><span>商品</span></div><div class="perf-filters"><label><span>笔记</span><select data-performance-field="note" aria-label="选择笔记"><option value="all" ${performanceState.note==='all'?'selected':''}>全部笔记</option>${['look','brand'].map(id=>`<option value="${id}" ${performanceState.note===id?'selected':''}>${NOTES.find(n=>n.id===id).short}</option>`).join('')}</select></label><div><small>营销场景</small><b>商品推广 × 笔记加热</b></div><div><small>广告类型</small><b>搜索广告</b></div><div class="perf-field-new" data-feature-new="report"><small>流量场域</small><b>AI 搜索推广</b>${featureNew('report')}</div></div></section><section class="report-panel perf-plan" id="ai-performance"><div class="perf-title-row"><div><h2>AI 搜索推广 · 投放表现 <span class="demo-data-badge">演示数据</span></h2><p>投放期间看进展，结束后在这里复盘。</p></div></div><div class="perf-plan-controls"><span class="perf-plan-state ${ended?'ended':performanceState.paused?'paused':'running'}"><i></i>${ended?'已结束':performanceState.paused?'已暂停':'投放中'}</span><span class="perf-plan-budget">日预算 <b>${planAmount(moneyCents(performanceState.daily))}</b>${metricHelp('daily')}</span><span class="perf-plan-goal">推广目标：互动量</span><div>${ended?'<span class="perf-history">历史数据可继续复盘</span>':`<button type="button" data-b-action="perf-toggle-plan">${performanceState.paused?'恢复计划':'暂停计划'}（模拟）</button><button type="button" class="perf-primary" data-b-action="perf-budget">调整预算</button>`}</div></div><p class="perf-period">统计区间：${reportPeriod()} · 以下为预置数据，调整不会改写历史。</p></section><section class="report-panel"><div class="report-section-title"><h2>数据概览</h2><button type="button" class="trend-toggle" data-b-action="toggle-trend" aria-pressed="${reportSettings.trend}">趋势图 <i class="${reportSettings.trend?'on':''}"></i></button></div>${performanceMetricCards(t)}${reportSettings.trend?reportChartHTML():''}</section><section class="report-panel"><div class="report-section-title"><h2>笔记投放表现</h2><small>按推广笔记汇总</small></div>${performanceNoteTable(rows)}</section><section class="report-panel"><div class="report-section-title"><h2>笔记诊断与调整</h2><small>${ended?'复盘建议':'供调整参考'}</small></div>${performanceDiagnosisHTML(rows)}</section>${performanceState.logs.length?`<section class="report-panel perf-log"><h2>本次模拟操作</h2>${performanceState.logs.slice(-3).reverse().map(log=>`<p>${esc(log)}</p>`).join('')}</section>`:''}<div class="report-data-foot">演示数据与操作，未发生真实投放或扣费。</div></main></div>${reportAsset?reportAssetHTML():''}${performanceState.modal?performanceModalHTML():''}${reportIntro?performanceIntroHTML():''}`}
function performanceCSV(range=reportSettings.range,note=performanceState.note){const rows=performanceRows(range,note),values=[['数据类型','示例区间','推广笔记','消耗（元）','广告曝光','广告点击','点击率','有效阅读','有效阅读率','互动量','互动成本（元）'],...rows.map(r=>{const t=reportTotals([r]);return ['演示数据',reportPeriod(range),NOTES.find(n=>n.id===r.id).short,t.cost.toFixed(2),t.impressions,t.clicks,reportFormat(t.ctr,'ctr'),t.reads,reportFormat(t.readRate,'readRate'),t.interactions,t.interactionCost===null?'—':t.interactionCost.toFixed(2)]})];return '\ufeff'+values.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n')}
function performanceEditErrors(type,draft){if(type==='budget')return moneyCents(draft.daily)>0?[]:['日预算需大于 0，最多保留两位小数。'];const errors=[];if(draft.bid!==''&&!(moneyCents(draft.bid)>0))errors.push('互动目标成本需大于 0，或留空沿用计划出价。');if(draft.memo.length>300)errors.push('优化备注最多 300 字。');return errors}
function performanceInput(target){const field=target.dataset?.perfEdit,filter=target.dataset?.performanceField;if(field&&performanceState.draft){performanceState.draft[field]=field==='active'?target.value==='on':target.value;const errors=performanceEditErrors(performanceState.modal,performanceState.draft);$('#perf-edit-error').textContent=errors.join(' ');document.querySelector('[data-b-action="perf-save-edit"]').disabled=!!errors.length;return}if(filter==='note'&&['all','look','brand'].includes(target.value)){performanceState.note=target.value;render()}else if(filter==='mode'&&['live','ended'].includes(target.value)){performanceState.mode=target.value;performanceState.modal=null;render()}}
function savePerformanceEdit(){if(!performanceCanManage()||!performanceState.modal)return false;const type=performanceState.modal,d=performanceState.draft;if(performanceEditErrors(type,d).length)return false;if(type==='budget'){const before=performanceState.daily;performanceState.daily=d.daily;performanceState.logs.push('日预算：'+planAmount(moneyCents(before))+' → '+planAmount(moneyCents(d.daily)))}else{performanceState.notes[type]={active:d.active,bid:d.bid,memo:d.memo.trim()};performanceState.logs.push('已更新「'+NOTES.find(n=>n.id===type).short+'」的投放设置'+(d.memo.trim()?'与优化备注':''))}performanceState.modal=null;render();return true}
function performanceAction(action,source){
 if(action==='feature-plan'||action==='feature-report'){openFeature(action.slice(8));return true}
 if(action==='close-report-intro'){reportIntro=false;render();return true}
 if(action==='intro-open-report'){reportIntro=false;openReport(true,true);return true}
 if(action.startsWith('metric-info-')){const button=source||document.querySelector('.metric-info[data-metric-help="'+action.slice(12)+'"]');if(button)showMetricHelp(button);return true}
 if(action==='continue-plan'||action==='dismiss-continue'){continuePlanGuide=false;render();if(action==='continue-plan')requestAnimationFrame(()=>{document.getElementById('plan-notes')?.scrollIntoView({block:'start'});document.querySelector('[data-plan-note]')?.focus({preventScroll:true})});return true}
 if(action==='perf-close-edit'){performanceState.modal=null;performanceState.error='';render();return true}
 if(action==='perf-save-edit'){savePerformanceEdit();return true}
 if(action==='perf-toggle-plan'){if(performanceCanManage()){performanceState.paused=!performanceState.paused;performanceState.logs.push(performanceState.paused?'已暂停示例计划':'已恢复示例计划');render()}return true}
 if(action==='perf-budget'||action.startsWith('perf-adjust-')){if(!performanceCanManage())return true;const type=action==='perf-budget'?'budget':action.slice(12);if(type!=='budget'&&!performanceState.notes[type])return true;performanceState.modal=type;performanceState.draft=type==='budget'?{daily:performanceState.daily}:{...performanceState.notes[type]};performanceState.error='';render();requestAnimationFrame(()=>document.querySelector('.perf-edit-dialog input,.perf-edit-dialog select')?.focus());return true}
 if(action.startsWith('perf-note-toggle-')){const id=action.slice(17);if(performanceCanManage()&&performanceState.notes[id]){const n=performanceState.notes[id];n.active=!n.active;performanceState.logs.push((n.active?'已恢复':'已暂停')+'「'+NOTES.find(n=>n.id===id).short+'」');render()}return true}
 return false;
}
