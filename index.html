function audienceTags(text=''){return [['护肤爱好者',/护肤|保湿|肌肤|skincare|skin care/i],['彩妆爱好者',/彩妆|化妆|底妆|唇妆|makeup|cosmetic/i],['通勤人群',/通勤|上班|职场|commut|working|office/i]].filter(([,re])=>re.test(text)).map(([tag])=>tag)}
function scoreCreator(c,form=state.form){
 const tags=audienceTags(form.audience),focus=focusList(form.concern),views=viewSamples[c.id],med=median(views);
 const interactionRate=c.eng.reduce((a,b)=>a+b,0)/views.reduce((a,b)=>a+b,0);
 const formatFit=form.format==='不确定'?0.5:(c.formats.includes(form.format)?1:0);
 const focusFit=focus.length?focus.filter(x=>c.angle.includes(x)).length/focus.length:0.5;
 const questionFit=form.question?(questionMatch(c,form.question)?1:0):0.5;
 const businessFit=form.goal==='提升品牌知名度'?(c.formats.some(x=>['vlog','场景化种草'].includes(x))?1:0.55):form.goal==='推广新品'?(c.formats.some(x=>['产品体验分享','开箱'].includes(x))?1:0.6):(c.formats.includes('产品体验分享')?1:c.formats.includes('场景化种草')?0.65:0.3);
 const dimensions={reach:clamp(med/60000)*100,audience:(tags.length?tags.filter(x=>c.aud.includes(x)).length/tags.length:0.5)*100,content:(0.4*(c.cats.includes(form.category)?c.rel/c.total:0)+0.3*focusFit+0.2*formatFit+0.1*questionFit)*100,interaction:clamp(interactionRate/0.08)*100,commercial:(0.8*businessFit+0.2*(c.commercial>0?1:0))*100,budget:clamp(1-c.fee/Math.max(1,Number(form.budget)))*100};
 const strategy=goalStrategies[form.goal]||goalStrategies['推广新品'];
 const contributions=Object.fromEntries(scoringKeys.map(k=>[k,dimensions[k]*strategy.weights[k]/100]));
 return {...c,medianViews:med,interactionRate,dimensions,contributions,score:Math.round(Object.values(contributions).reduce((a,b)=>a+b,0)*10)/10,parts:{aud:dimensions.audience/4,concern:focusFit*25}};
}
function rank(form=state.form){return creators.filter(c=>c.cats.includes(form.category)&&c.fee<=Number(form.budget)).map(c=>scoreCreator(c,form)).sort((a,b)=>b.score-a.score||a.fee-b.fee||a.id.localeCompare(b.id))}
let discovery={mode:'recommend',q:'',category:'',format:'',maxFee:'',anchor:null,preset:'balanced'};
const similarityWeights={balanced:{content:45,audience:30,price:15,size:10},content:{content:65,audience:20,price:10,size:5},audience:{content:25,audience:55,price:10,size:10},price:{content:25,audience:20,price:45,size:10}};
function overlap(a,b){const union=new Set([...a,...b]);return union.size?a.filter(x=>b.includes(x)).length/union.size:0}
function similarity(a,b,preset=discovery.preset){const dimensions={content:(overlap(a.cats,b.cats)+overlap(a.formats,b.formats)+overlap(a.angle,b.angle))/3,audience:overlap(a.aud,b.aud),price:Math.min(a.fee,b.fee)/Math.max(a.fee,b.fee),size:Math.min(a.followers,b.followers)/Math.max(a.followers,b.followers)};const weights=similarityWeights[preset]||similarityWeights.balanced;return {score:Math.round(Object.keys(weights).reduce((n,k)=>n+dimensions[k]*weights[k],0)),dimensions,weights}}
function resetDiscovery(mode='recommend',anchor=null){discovery={mode,q:'',category:state.form.category,format:'',maxFee:String(state.form.budget),anchor,preset:'balanced'}}
function discoveryResults(){const anchor=creators.find(c=>c.id===discovery.anchor),q=discovery.q.trim().toLowerCase();return creators.filter(c=>c.id!==discovery.anchor&&(!discovery.category||c.cats.includes(discovery.category))&&(!discovery.format||c.formats.includes(discovery.format))&&c.fee<=Number(discovery.maxFee)&&(!q||[c.name,c.style,c.title,...c.cats,...c.aud,...c.angle,...c.formats].join(' ').toLowerCase().includes(q))).map(c=>({...scoreCreator(c),similar:anchor?similarity(anchor,c):null})).filter(c=>discovery.mode!=='similar'||c.similar.score>=40).sort((a,b)=>discovery.mode==='similar'?b.similar.score-a.similar.score||b.score-a.score:b.score-a.score||a.fee-b.fee)}
function scoreBreakdown(c){const strategy=goalStrategies[state.form.goal]||goalStrategies['推广新品'];return '<div class="score-detail">'+scoringKeys.map(k=>'<div class="metric"><span>'+scoringLabels[k]+' · '+strategy.weights[k]+'%</span><b>'+c.dimensions[k].toFixed(0)+'/100 → '+c.contributions[k].toFixed(1)+'分</b></div>').join('')+'</div>'}
function strategyPanel(){const strategy=goalStrategies[state.form.goal]||goalStrategies['推广新品'];return `<section class="panel strategy"><div class="strategy-head"><div><h2>按合作目标推荐</h2><p>${esc(strategy.reason)}</p></div><div><label for="recommendationGoal">切换合作目标</label><select id="recommendationGoal">${Object.entries(goalStrategies).map(([key,value])=>`<option value="${key}" ${state.form.goal===key?'selected':''}>${value.label}</option>`).join('')}</select></div></div><div class="weights">${scoringKeys.map(k=>`<span>${scoringLabels[k]} <b>${strategy.weights[k]}%</b></span>`).join('')}</div><p class="field-note">先筛品类与单人报价，再按六维加权排序；匹配分不是合作成功率。权重为演示假设，未经过效果实验。</p><details><summary>查看评分口径与研究依据</summary><p class="smalltext">触达：近5条示例视频播放中位数÷6万，上限100分。互动：同5条互动总数÷播放总数，再按8%映射，上限100分。阈值仅用于演示，不是行业基准。</p><p class="smalltext">内容结合垂类、内容重点、形式及消费疑问；人群按已识别标签覆盖率计算，未识别时使用中性50分并提示待核验。商业表达看内容形式与是否有商业内容，不是成交能力。预算为1−单条报价÷总预算。总分=各维度分×对应权重。</p><p class="smalltext">近5条播放、互动与达人报价均为虚构。购买目标缺少真实订单、点击与转化数据，只采用替代指标。</p><p class="smalltext">参考 <a target="_blank" rel="noopener" href="https://ads-useast2a.tiktok.com/resources/help/article/full-funnel-marketing-tiktok?lang=en">TikTok 全漏斗框架</a> 与 <a target="_blank" rel="noopener" href="https://ads-useast2a.tiktok.com/resources/help/article/about-top-ads-insight-in-tiktok-one?lang=en">目标相关指标说明</a>，具体数值由本 Demo 设计。</p></details></section>`}
function discoveryPanel(){const anchor=creators.find(c=>c.id===discovery.anchor),isSimilar=discovery.mode==='similar';const w=similarityWeights[discovery.preset];return `<section class="panel discovery"><div class="section-title"><h2>${isSimilar?'与 '+esc(anchor.name)+' 相似的达人':'手动搜索达人'}</h2><button class="small" data-discover="recommend">返回推荐</button></div><p class="smalltext">搜索仅覆盖12位虚构示例达人，未接入TikTok搜索。当前合作目标及原需求保持不变。</p>${isSimilar?`<label for="similarityPreset">你希望哪方面更相似？</label><select id="similarityPreset"><option value="balanced" ${discovery.preset==='balanced'?'selected':''}>综合相似</option><option value="content" ${discovery.preset==='content'?'selected':''}>内容更像</option><option value="audience" ${discovery.preset==='audience'?'selected':''}>人群更像</option><option value="price" ${discovery.preset==='price'?'selected':''}>价格更接近</option></select><p class="field-note">相似分：内容 ${w.content}% + 人群 ${w.audience}% + 价格 ${w.price}% + 粉丝量级 ${w.size}%。仅显示相似分≥40的人选（演示阈值）。这是与该达人的相似程度，不等于对你需求的推荐分；不声称真实粉丝重合。</p>`:''}<form id="discoveryForm" class="search-grid"><div><label for="creatorQuery">姓名 / 内容 / 人群关键词</label><input id="creatorQuery" name="q" maxlength="100" value="${esc(discovery.q)}" placeholder="如 Mia、通勤、开箱"></div><div><label for="searchCategory">品类</label><select id="searchCategory" name="category"><option value="">不限（含跨品类）</option>${['护肤','底妆','唇妆'].map(v=>`<option ${discovery.category===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label for="searchFormat">内容形式</label><select id="searchFormat" name="format"><option value="">不限</option>${['产品体验分享','开箱','场景化种草','vlog'].map(v=>`<option ${discovery.format===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label for="searchMaxFee">单条报价上限（美元）</label><input id="searchMaxFee" name="maxFee" type="number" min="1" max="1000000" required value="${esc(discovery.maxFee)}"></div><div class="actions"><button type="submit" class="primary">搜索</button><button type="button" id="resetSearch">重置条件</button></div></form><p class="field-note">可以主动放宽筛选来比较；报价高于合作总预算的达人只能查看、不能加入。跨品类人选需人工核对；修改原需求后会重新校验名单。</p></section>`}
function renderRecommendations(){const recommended=discovery.mode==='recommend';const all=rank(),r=recommended?all:discoveryResults();return `<div class="intro"><h1>挑选达人</h1><p class="smalltext muted">一份结果列表，按合作目标排序；可直接搜索、筛选并加入名单。当前均为虚构示例。</p></div>${summary()}${strategyPanel()}<div class="discovery-entry"><span>${recommended?'找到 '+r.length+' 位达人 · 按'+(goalStrategies[state.form.goal]?.label||state.form.goal)+'匹配度排序':'找到 '+r.length+' 位 · '+(discovery.mode==='similar'?'按相似分排序':'按当前合作目标排序')}</span><button data-discover="search">手动搜索其他达人</button></div>${recommended?'':discoveryPanel()}${r.length?`<div class="cards">${r.map(card).join('')}</div>`:`<div class="empty"><h2>暂无符合当前条件的达人</h2><p>没有自动放宽你的品类或预算。可以修改需求，或手动调整搜索条件。</p><button data-go="1">修改合作需求</button><button data-discover="search">手动搜索达人</button></div>`}`}
function bindDiscovery(){
 document.querySelectorAll('[data-discover]').forEach(el=>el.onclick=()=>{resetDiscovery(el.dataset.discover);render();window.scrollTo(0,0)});
 document.querySelectorAll('[data-similar]').forEach(el=>el.onclick=()=>{resetDiscovery('similar',el.dataset.similar);render();window.scrollTo(0,0)});
 if($('#recommendationGoal'))$('#recommendationGoal').onchange=e=>{state.form.goal=e.target.value;state.edits={};state.signature=JSON.stringify(state.form);resetDiscovery();save();render();toast('已按新目标重新评分；保留当前名单，旧材料已重置')};
 if($('#similarityPreset'))$('#similarityPreset').onchange=e=>{discovery.preset=e.target.value;render()};
 if($('#discoveryForm'))$('#discoveryForm').onsubmit=e=>{e.preventDefault();if(!e.target.reportValidity())return;const values=Object.fromEntries(new FormData(e.target));discovery={...discovery,...values};render()};
 if($('#resetSearch'))$('#resetSearch').onclick=()=>{resetDiscovery(discovery.mode,discovery.anchor);render()};
}

if(state.form.selling==='轻盈质地、便携包装；仅介绍商家已确认的产品信息')state.form.selling=example.selling;

function renderForm(){return`<div class="intro"><h1>填写合作需求</h1></div><div class="layout"><form id="briefForm" class="panel"><div class="section-title"><h2>你的合作需求</h2><div class="actions"><button type="button" class="small" id="exampleBtn">填入示例</button><button type="button" class="small" id="clearBtn">清空表单</button></div></div><div class="inline" style="margin-bottom:22px"><span class="pill">美国市场</span><span class="pill">TikTok</span><span class="pill">英语内容</span><span class="pill">USD · 达人合作预算</span></div><div class="grid">${field('brand','品牌名称 *')}${field('product','产品名称 *')}${field('englishProduct','英文产品名（选填）')}${field('category','美妆子类目','text',['护肤','底妆','唇妆'])}${field('selling','产品核心卖点 *','textarea',null,true)}${field('audience','目标消费者（可自由填写）')}${field('question','消费者疑问（选填，参与内容方向匹配）')}${field('goal','这次合作主要希望达到什么效果？','text',['提升品牌知名度','推广新品','促进购买'])}${field('format','内容形式','text',['不确定','产品体验分享','开箱','场景化种草','vlog'])}${focusFields()}${field('budget','合作总预算（美元）*','number')}${field('date','期望发布时间 *','date')}${field('banned','内容注意事项（选填）','textarea',null,true)}</div><div class="field-note">预算不含寄样、税费、投放与额外授权。</div></form><aside class="panel side"><h2>合作准备</h2><ul><li>填写需求</li><li>挑选达人</li><li>确认预算</li><li>准备材料并发起邀约</li></ul><span class="pill demo">示例数据</span></aside></div>`}
function reason(c){const tags=audienceTags(state.form.audience),matched=tags.filter(x=>c.aud.includes(x));return `${tags.length?'需求中识别出 '+tags.join('、')+'；示例标签命中 '+matched.length+'/'+tags.length:'需求人群暂无可识别标签，待人工核验'}；${focusList(state.form.concern).some(x=>c.angle.includes(x))?'内容标签与所选重点相关':'内容方向需进一步核对'}。${questionMatch(c,state.form.question)?'消费疑问关键词与内容标签相关。':''}`}
function card(c){const chosen=state.selected.includes(c.id),tooExpensive=creatorFee(c)!==null&&creatorFee(c)>Number(state.form.budget);return`<article class="card ${chosen?'chosen':''}" data-card="${c.id}"><div class="person"><div class="avatar" style="background:${c.color}">${c.name.split(' ').map(v=>v[0]).join('')}</div><div><h3>${c.name}</h3><div class="handle">TikTok · 虚构示例达人 · 受众未核验</div></div></div><div class="stats"><div><strong>${(c.followers/1000).toFixed(1)}k</strong><small>示例粉丝量</small></div><div><strong>${feeLabel(c)}</strong><small>示例单条合作报价</small></div></div><div class="score-total">${c.similar?`相似分 ${c.similar.score}/100 · `:""}推荐分 ${c.score.toFixed(1)}/100</div><p class="reason">${esc(reason(c))}</p><div class="metrics"><div class="metric"><span>示例视频触达</span><b>近5条中位数 ${c.medianViews.toLocaleString()} 播放</b></div><div class="metric"><span>内容匹配</span><b>${Math.round(100*c.rel/c.total)}% 同类内容</b></div><div class="metric"><span>受众标签（模拟）</span><b>${esc(c.aud.join(' / '))}</b></div><div class="metric"><span>历史互动</span><b>近 5 篇均值 ${avg(c).toLocaleString()}</b></div><div class="metric"><span>合作内容形式</span><b>${esc(c.formats.join(' / '))}</b></div><div class="metric"><span>预算参考</span><b>CPE ${money(c.fee/avg(c))}</b></div></div><details><summary>查看达人详情与评分依据</summary>${scoreBreakdown(c)}${c.similar?`<p>与参考达人的内容标签重合 ${Math.round(c.similar.dimensions.content*100)}%；人群标签重合 ${Math.round(c.similar.dimensions.audience*100)}%；示例单价差 ${money(Math.abs(c.fee-creators.find(x=>x.id===discovery.anchor).fee))}。</p>`:""}<p>${c.style}。代表内容：${c.title}（虚构标题）。</p><p>近30天 ${c.total} 篇中，相关内容 ${c.rel} 篇。近5篇同类型内容赞、藏、评合计：${c.eng.join('、')}。CPE为报价÷历史平均互动，不是未来效果预测。</p><p>内容形式：${c.formats.join('、')}。本次形式${state.form.format==='不确定'?'待商家与达人确认':c.formats.includes(state.form.format)?'匹配':'需协商'}。受众是虚构标签。年龄分布、美国受众占比、消费能力均未提供，待核验；不从内容标签推断真实粉丝画像。商业内容占比仅为示例记录，不代表成交能力。</p><p>近5条播放示例：${viewSamples[c.id].join("、")}；互动率 ${(c.interactionRate*100).toFixed(1)}%，非转化率。${audienceTags(state.form.audience).length?"":"目标人群无法识别，采用中性50分，待人工核验。"}</p>${!c.cats.includes(state.form.category)?"<p class=\"note\">此达人与原需求品类不同，请人工核对适配。</p>":""}<button class="small" data-similar="${c.id}">查看更多相似达人</button></details><div class="pending">报价、档期与授权待确认</div><div class="action"><span class="pill">${chosen?'已加入名单':'未加入名单'}</span><button class="small ${chosen?'':'primary'}" data-toggle="${c.id}" ${tooExpensive&&!chosen?'disabled':''}>${chosen?'移出名单':tooExpensive?'单价超总预算':'加入名单'}</button></div></article>`}

function renderList(){return`<div class="intro"><h1>确认名单与预算</h1></div>${summary()}<div class="layout"><section class="panel"><div class="section-title"><h2>拟邀约名单 · ${selected().length} 位</h2><button class="small" data-go="2">返回补选 / 替换</button></div>${selected().length?selected().map(c=>`<div class="listrow"><div class="person"><div class="avatar" style="background:${c.color}">${c.name[0]}</div><div><h3>${c.name}</h3><div class="smalltext muted">${esc(c.style)}</div><div class="field-note">建议回应：${esc(state.form.concern)} · ${esc(state.form.format)}</div></div></div><strong>${feeLabel(c)}</strong><div class="actions"><button class="small" data-toggle="${c.id}">移除</button></div></div>`).join(''):`<p class="muted">名单还是空的，请先返回选择达人。</p>`}<div class="note" style="margin-top:24px">示例名单 · 报价与档期待确认</div></section><aside class="panel side"><div class="kicker">合作预算</div><div class="budget">${money(total())}</div><div class="smalltext">合作预算上限 ${money(state.form.budget)}</div><div class="track"><i style="width:${Math.min(100,total()/state.form.budget*100)}%;background:${total()>state.form.budget?'var(--red)':'var(--green)'}"></i></div><strong>${total()>state.form.budget?'超出 '+money(total()-state.form.budget):'剩余 '+money(state.form.budget-total())}</strong><div class="divider"></div><p class="smalltext">每人 1 条内容；不含寄样、税费、投放及额外授权。</p></aside></div>${total()>state.form.budget?'<div class="error" role="alert">当前名单已超预算，请移除或替换达人后继续。</div>':''}`}
function invitation(c,lang){const f=state.form;if(lang==='zh')return`您好 ${c.name}，\n\n我们是 ${f.brand}，正在为美国市场的 ${f.product} 寻找内容合作伙伴。您擅长的${c.style}与本次方向相关，希望邀请您围绕「${f.concern}」创作${f.format==='不确定'?'适合您风格的内容':f.format+'内容'}。\n\n产品信息：${f.selling}\n期望发布时间：${f.date}\n我们暂按 ${feeLabel(c)} / 条规划（演示预算，待您确认）。\n\n请问您近期是否有档期？也希望了解您的正式报价、修改次数、商业合作披露方式，以及内容使用授权范围和是否包含广告投放授权。\n\n我们尊重您的真实体验与创作表达，期待进一步沟通。`;
return`Hi ${c.name},\n\nWe are ${english(f.brand,'brand name')}, exploring a paid TikTok collaboration for ${english(f.englishProduct.trim()||f.product,'product name')} in the US market. We would love to discuss ${fLabels[f.format]} focused on ${focusList(f.concern).map(x=>fLabels[x]||x).join(' and ')}.\n\nTarget publication date: ${f.date}\nPlanning budget: ${feeLabel(c)} for one post (demo estimate; subject to your quote).\n\nWould you be available? Please share your rate, revision terms, disclosure approach and content usage rights, including whether paid advertising rights are included. We welcome your creative input and honest experience.\n\nProduct details:\n${english(f.selling,'product details')}\n\nThank you!\n${english(f.brand,'brand name')}`}

Brand: ${english(f.brand,'brand name')}
Product: ${english(f.englishProduct||f.product,'product name')}

function editor(key,text){return esc(state.edits[key]??text)}
function renderMaterials(){const c=selected().find(x=>x.id===state.activeCreator)||selected()[0];state.activeCreator=c.id;return`<div class="intro"><h1>准备并发送合作材料</h1></div><div class="materials"><section class="panel"><div class="tabs"><button data-tab="invite" class="${state.tab==='invite'?'active':''}">中英邀约话术</button><button data-tab="brief" class="${state.tab==='brief'?'active':''}">英文产品 Brief</button></div>${state.tab==='invite'?`<label for="creatorSelect">选择达人</label><select id="creatorSelect">${selected().map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.name} · ${feeLabel(x)}</option>`).join('')}</select><div class="editor-label"><strong>英文邀约</strong><button class="small" data-copy="en-${c.id}">复制英文</button></div><textarea class="editor" aria-label="英文邀约" data-edit="en-${c.id}">${editor('en-'+c.id,invitation(c,'en'))}</textarea><div class="editor-label"><strong>中文对照</strong><button class="small" data-copy="zh-${c.id}">复制中文</button></div><textarea class="editor" aria-label="中文邀约" data-edit="zh-${c.id}">${editor('zh-'+c.id,invitation(c,'zh'))}</textarea>`:`<div class="editor-label"><strong>英文产品合作说明</strong><button class="small" data-copy="brief">复制 Brief</button></div><textarea class="editor" style="min-height:650px" aria-label="产品 Brief" data-edit="brief">${editor('brief',briefText())}</textarea>`}</section><aside class="panel side"><h2>核对并编辑材料</h2><p>${selected().length} 位达人 · ${money(total())}</p><p class="smalltext muted">中英邀约 + 英文产品 Brief</p><button class="small" id="downloadAll">下载全部材料</button><div class="divider"></div><p class="field-note">示例采用预置英文，不提供自动翻译。出现 ENGLISH REQUIRED 时，请补齐英文后再模拟邀约。</p><p class="field-note">更改需求或名单将重置文案编辑。总览 Brief 会用于未单独编辑的达人版本；已独立编辑的版本须分别核对。</p></aside></div>`}
function render(){document.querySelector('.steps').innerHTML=['填写需求','查看推荐','确认名单','合作材料'].map((n,i)=>`<div class="step ${state.step===i+1?'active':state.step>i+1?'done':''}"><b>${state.step>i+1?'✓':i+1}</b>${n}</div>`).join('');$('#app').innerHTML=state.step===1?renderForm():state.step===2?renderRecommendations():state.step===3?renderList():renderMaterials();$('#bar').innerHTML=state.step===1?`<div><strong>填写合作需求</strong><div class="sub">可使用示例快速体验</div></div><button class="primary" type="submit" form="briefForm">查看推荐达人 →</button>`:`<div><strong>${state.selected.length} 位 · ${money(total())}</strong><div class="sub">${total()>state.form.budget?'超预算 '+money(total()-state.form.budget):'剩余预算 '+money(state.form.budget-total())} · USD</div></div><div class="actions"><button data-go="${state.step===4?3:state.step===3?2:1}">${state.step===4?'调整名单':'上一步'}</button>${state.step===4?'<button id="downloadBtn">下载材料</button><button id="emailBtn">发给自己</button><button class="primary" id="inviteBtn">邀约达人</button>':`<button class="primary" data-go="${state.step+1}" ${!state.selected.length||(state.step===3&&total()>state.form.budget)?'disabled':''}>${state.step===2?'确认合作名单':'生成合作材料'} →</button>`}</div>`;
if(state.step===1){$('#clearBtn').onclick=clearForm;$('#exampleBtn').onclick=()=>{state.form={...example};save();render()};$('#briefForm').oninput=()=>{state.form={...state.form,...readForm($('#briefForm'))};save()};$('#briefForm').onsubmit=e=>{e.preventDefault();const f=readForm(e.target);f.budget=Number(f.budget);if(!e.target.reportValidity()||!f.category||!f.goal||!f.format){return}if(!f.brand.trim()||!f.product.trim()||!f.selling.trim()||!Number.isFinite(f.budget)||f.budget<=0){toast('请补全品牌、产品、卖点与有效预算');return}state.form=f;resetDiscovery();const allowed=new Set(rank(f).map(c=>c.id));const prev=state.selected.length;state.selected=state.selected.filter(id=>allowed.has(id));if(state.signature!==JSON.stringify(f)){state.edits={};state.signature=JSON.stringify(f)}go(2);if(prev>state.selected.length)toast('已移除不符合新预算或品类的候选')};}
document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(Number(el.dataset.go)));document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{const id=el.dataset.toggle;if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else {const c=creators.find(x=>x.id===id);if(!c||creatorFee(c)!==null&&creatorFee(c)>Number(state.form.budget)){toast('该单条报价超过合作总预算，不能加入');return}state.selected.push(id)}state.edits={};save();const y=window.scrollY;render();window.scrollTo(0,y)});document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;render()});document.querySelectorAll('[data-edit]').forEach(el=>el.oninput=()=>{state.edits[el.dataset.edit]=el.value;save()});document.querySelectorAll('[data-copy]').forEach(el=>el.onclick=()=>copy(el.dataset.copy));if($('#creatorSelect'))$('#creatorSelect').onchange=e=>{state.activeCreator=e.target.value;render()};if($('#downloadBtn'))$('#downloadBtn').onclick=downloadAll;if($('#downloadAll'))$('#downloadAll').onclick=downloadAll;if($('#emailBtn'))$('#emailBtn').onclick=()=>openEmail('self');if($('#inviteBtn'))$('#inviteBtn').onclick=()=>openEmail('creator');bindDiscovery();}

$('#aboutBtn').onclick=()=>{$('#modal').innerHTML=`<div class="panel"><div class="section-title"><h2>关于本演示</h2><button id="closeModal" aria-label="关闭说明">×</button></div><p>面向中国中小商家出海，当前只以美妆演示。未接入 TikTok One 或实时大模型，不属于小红书或 TikTok 官方产品。本演示使用虚构达人及示例报价。推荐根据填写的需求匹配；邮箱发送和达人邀约均为模拟，不会实际投递。</p><button id="resetBtn">清除本机草稿</button></div>`;$('#modal').classList.remove('hidden');$('#closeModal').onclick=closeModal;$('#resetBtn').onclick=()=>{if(confirm('清空后将移除当前需求、名单和材料。')){localStorage.removeItem('redhood-v3-public');location.reload()}};$('#closeModal').focus()};

function english(value,label){

 const translations={
 '轻盈乳液质地，按压泵头，50mL 便携包装':'Lightweight lotion texture, pump dispenser, and portable 50 mL packaging.',
 '轻盈保湿乳':'Lightweight Moisturizer',

 '展示真实质地，不使用美颜滤镜':'Show the actual texture. Do not use beauty filters.',

 '提升品牌知名度':'Increase brand awareness','推广新品':'Introduce a new product','促进购买':'Support purchase consideration'
 };

function publicScore(c,form=state.form){
 const weights=form.goal==='提升品牌知名度'?{category:30,format:60,focus:10}:form.goal==='促进购买'?{category:30,format:20,focus:50}:{category:40,format:30,focus:30};
 const focus=focusList(form.concern),broad=!c.cats.includes(form.category)&&categoryMatch(c,form.category);
 const category=categoryMatch(c,form.category)?(broad?0.5:1):0,format=form.format==='不确定'?null:c.formats.includes(form.format)?1:0;
 const contentFocus=focus.length?focus.filter(x=>c.angle.includes(x)).length/focus.length:null;
 const denominator=weights.category+(format===null?0:weights.format)+(contentFocus===null?0:weights.focus);
 const score=Math.round((category*weights.category+(format??0)*weights.format+(contentFocus??0)*weights.focus)/denominator*100);
 return {...c,score,publicWeights:weights,broad};
}

publicScore=function(c,form=state.form){
 const rule=publicGoalRules[form.goal]||publicGoalRules['推广新品'],w=rule.weights,focus=focusList(form.concern),broad=!c.cats.includes(form.category)&&categoryMatch(c,form.category);
 const factors={category:categoryMatch(c,form.category)?(broad?0.5:1):0,format:form.format==='不确定'||!form.format?null:c.formats.includes(form.format)?1:0,focus:focus.length?focus.filter(x=>c.angle.includes(x)).length/focus.length:null};
 const weightSum=Object.keys(w).reduce((n,k)=>n+(factors[k]===null?0:w[k]),0),effectiveWeights=Object.fromEntries(Object.keys(w).map(k=>[k,factors[k]===null?0:w[k]/weightSum*100]));
 const contributions=Object.fromEntries(Object.keys(w).map(k=>[k,(factors[k]??0)*effectiveWeights[k]]));
 return {...c,broad,factors,effectiveWeights,contributions,publicWeights:w,score:Math.round(Object.values(contributions).reduce((a,b)=>a+b,0))};
};
function budgetPlan(budget=Number(state.form.budget),goal=state.form.goal){
 const b=Number(budget),rule=publicGoalRules[goal]||publicGoalRules['推广新品'];if(!Number.isFinite(b)||b<=0)return {budget:0,invalid:true,micro:0,nano:0,count:0,cost:0,reserve:0,minReserve:0,cap:0,averageCount:0};
 const minReserve=Math.ceil(b*.1),cap=Math.max(0,b-minReserve),nPrice=planningReference.nano.unit,mPrice=planningReference.micro.unit;
 // Choose a subset of the goal's starter template, always fitting under the 90% planning cap.
 let best={micro:0,nano:0,value:0};for(let m=0;m<=rule.micro;m++)for(let n=0;n<=rule.nano;n++){const cost=m*mPrice+n*nPrice;if(cost>cap)continue;const value=(goal==='提升品牌知名度'?m*2.5+n: m*4+n)+(m&&n?.25:0);if(value>best.value||value===best.value&&cost>best.micro*mPrice+best.nano*nPrice)best={micro:m,nano:n,value}}
 const cost=best.micro*mPrice+best.nano*nPrice,count=best.micro+best.nano;
 return {budget:b,micro:best.micro,nano:best.nano,count,cost,reserve:b-cost,minReserve,cap,averageCount:Math.floor(cap/planningReference.average),nanoCapacity:Math.floor(cap/nPrice),microCapacity:Math.floor(cap/mPrice),templateCost:rule.micro*mPrice+rule.nano*nPrice,trimmed:best.micro!==rule.micro||best.nano!==rule.nano};
}
function publicWorkedRows(c,form=state.form){const x=publicScore(c,form),focus=focusList(form.concern),labels={category:'品类证据',format:'形式证据',focus:'展示重点证据'};const notes={category:x.broad?'仅有彩妆大类，细分待确认':x.factors.category?'公开资料明确列出'+form.category:'未找到所需品类证据',format:x.factors.format===null?'商家选择不确定，此项不计':x.factors.format?'公开服务列有'+form.format:'未找到'+form.format+'的公开证据',focus:focus.length?'已找到 '+focus.filter(k=>c.angle.includes(k)).join('、')+'；覆盖 '+focus.filter(k=>c.angle.includes(k)).length+'/'+focus.length:'未指定重点，此项不计'};return Object.keys(labels).map(k=>({key:k,label:labels[k],factor:x.factors[k],weight:x.effectiveWeights[k],contribution:x.contributions[k],note:notes[k].replace('已找到 ；','尚无对应证据；')}))}

function budgetReportHtml(){const p=budgetPlan(),ref=planningReference;return `<div class="budget-report" id="budgetReport"><div class="section-title"><h3>预算 ${money(p.budget)}，可以规划几位？</h3><button class="small" data-report-download>下载小报告</button></div><p class="report-conclusion">${p.count?`本轮建议先按 <strong>${p.count} 位</strong>规划：<strong>${budgetPlanLabel(p)}</strong>。`:'预算偏紧，建议先确认一位达人的真实报价，再决定是否缩小交付。'}${p.trimmed&&p.count?'已按当前预算缩减目标组合。':''}</p><p class="smalltext muted">微型：1万–不足10万粉丝；纳米：1千–不足1万粉丝。量级仅用于规划，仍需核对近期播放与美国受众。</p><div class="report-budget-grid"><div><span>拟合作费用</span><strong>${money(p.cost)}</strong><small>${p.micro} × $600 + ${p.nano} × $200</small></div><div><span>议价 / 后续追加余量</span><strong>${money(p.reserve)}</strong><small>至少留10%；费用未实际发生</small></div><div><span>本次交付假设</span><strong>每人 1 条</strong><small>15–60秒，达人本人账号自然发布</small></div></div><p>${esc(p.trimmed?'预算不足以覆盖该目标的完整起步组合，已缩减人数。先核对最小可行的交付与真实报价，避免先承诺再超支。':(publicGoalRules[state.form.goal]||publicGoalRules['推广新品']).planWhy)}</p><p class="field-note">人数是规划席位；当前4位真人尚未核验粉丝量、发布服务和报价，不能直接确认谁可落位，也不会自动加入名单。</p><p class="field-note">$600 / $200 是本工具选取的规划单价，处于下表公开估计区间内，不是均价或真人报价。${p.count?'方案合作费 + 余量 = '+money(p.budget)+'。':''}寄样、物流、税费、佣金、广告投放、Spark Ads与额外使用授权均需另算；若 ${money(p.budget)} 为全包预算，应先扣除这些费用后重新规划。</p><details><summary>行业价格依据、其他目标组合与风险</summary><h4>先看市场参考，再看本次分配</h4><p>Collabstr 2026报告以2025年平台成交为背景：TikTok平均每次合作费用 <strong>$186</strong>，与UGC的$154分开统计。它不是“美国美妆、某粉丝量、每人1条”的精确均价。按90%预算 ÷ $186 机械折算约 <strong>${p.averageCount} 次合作</strong>，不能据此承诺${p.averageCount}位达人。</p><div class="report-table-wrap"><table class="report-table"><thead><tr><th>量级（本作品边界）</th><th>公开估计 / 条</th><th>本方案采用</th><th>如何理解</th></tr></thead><tbody><tr><th>纳米：1千–不足1万粉丝</th><td>$25–$200</td><td>$200</td><td>按本假设全投纳米约${p.nanoCapacity}位，但增加沟通成本，不代表最佳选择</td></tr><tr><th>微型：1万–不足10万粉丝</th><td>$150–$1,200</td><td>$600</td><td>按本假设全投微型约${p.microCapacity}位，需核对近期播放和受众</td></tr><tr><th>中腰部：10万–50万粉丝</th><td>$800–$6,000</td><td>未纳入首轮模板</td><td>部分报价可能可
