function art(type,large=false){const uid=type+(large?'L':'S');const bg=type==='compare'?'#e9ebe4':type==='brand'?'#eae9e0':'#eeeee5';let shapes;if(type==='guide'){shapes=`<g transform="translate(-9,51) scale(.68)">${coat('#e7dfd0',uid+'a',2)}</g><g transform="translate(81,46) scale(.7)">${coat('#cdd1cb',uid+'b',1)}</g><g transform="translate(175,50) scale(.68)">${coat('#c3beb2',uid+'c')}</g>`}else if(type==='compare'){shapes=`<g transform="translate(22,45) scale(.85)">${coat('#e8e1d3',uid+'a',2)}</g><g transform="translate(167,45) scale(.85)">${coat('#cdd2ce',uid+'b',1)}</g>`}else{shapes=`<path d="M198 74v-12q0-8 8-5m-8 16-43 25h86z" stroke="#9ba18f" stroke-width="1.5" fill="none"/><g transform="translate(66,38) scale(1.28)">${coat('#dfd8c9',uid+'c')}</g>`}return `<svg viewBox="0 0 390 340" preserveAspectRatio="${large?'xMidYMid meet':'xMidYMid slice'}" role="img" aria-label="${type==='compare'?'两款大衣对比':type==='guide'?'三款浅色大衣':'通勤大衣'}示意插画"><rect width="390" height="340" fill="${bg}"/><path d="M0 300Q180 282 390 298v42H0Z" fill="#e0e3d6" opacity=".38"/>${large?'<path d="M20 307h350" stroke="#cfd7c1" stroke-opacity=".4"/>':''}${shapes}</svg>`}

function card(stage){const n=NOTES[stage];if(n.ad&&state.closedAd)return '<div class="next-hint">本次对话的广告已关闭，你可以继续查看自然笔记。</div>';return `<section class="note-section"><div class="note-section-label"><span>${n.ad?'<span class="ad-mark">广告 · 品牌推广</span>':'接着看相关笔记'}</span>${n.ad?'<button class="dismiss" data-action="dismiss">不感兴趣 ×</button>':'<span>自然推荐</span>'}</div><button class="note-card ${n.ad?'sponsored':''}" data-note="${n.id}" aria-label="打开${n.short}" ${n.ad?'id="ad-card"':''}><div class="thumb">${noteArt(n.id)}<span class="thumb-caption">${n.tag}</span></div><div class="note-summary"><h3>${n.short}</h3><span class="author"><span class="avatar">${n.initial}</span>${n.author}</span><span class="note-link">查看完整笔记 ${icon('arrow',13)}</span></div></button>${n.ad?`<button class="dismiss" style="margin-top:8px;color:#a6ad9d" data-action="why">为什么展示这篇？</button>${state.why?'<div class="reason-text">你主动表达了对伊芙丽大衣的兴趣，所以在回答之后展示相关品牌内容。广告不参与前两轮自然推荐，也不改变回答中的判断。本例为虚拟投放，无真实付费。</div>':''}`:''}</section>`}
function composer(){const host=state.mode==='host',done=!host&&firstMissing()===3;if(done)return '<footer class="composer-zone"><div class="completed-compose"><span>继续查看上方笔记</span><button type="button" data-action="reset">新对话</button></div></footer>';const draft=host?QUESTIONS[0]:state.draft;return `<footer class="composer-zone"><div class="composer" id="composer"><textarea id="question" aria-label="对话问题" maxlength="180" rows="2" ${host||firstMissing()===0?'readonly':''}>${esc(draft)}</textarea><button class="send" type="button" data-action="send" aria-label="发送问题">${icon('send',21)}</button></div></footer>`}

const noteBodies={guide:`<p>买大衣之前，先把“知性风”变成几件可以核对的事：你要在哪穿、喜欢什么衣长、能接受怎样的护理方式。</p><h3>01 先想穿着场景</h3><p>如果主要通勤，可以先试直身或微收腰款式。坐下、抬手、背包时，也要看看是否方便。</p><h3>02 把预算当作边界</h3><p>1000 元左右可以作为筛选条件。核对实际到手价格、配送与退换规则，不必因为折扣自动提高预算。</p><h3>03 面料和版型分别看</h3><p>先读完整成分和护理要求，再看肩宽、衣长和尺码表。成分不能单独说明保暖或上身效果。</p><div class="evidence">这是一份虚拟选购指南，不提供真实商品报价或购买建议。插图仅展示款式，不对应在售商品。</div><p>下一步可以选两个感兴趣的品牌，对照具体款式继续比较。</p>`,compare:`<p>“伊芙丽还是太平鸟”并没有脱离款式、预算和个人身形的标准答案。这篇演示笔记用同一套问题，帮助你比较两件候选大衣。</p><h3>对比清单</h3><ul><li><strong>版型：</strong>肩线是否合适？衣长到哪里？系腰带后活动是否方便？</li><li><strong>面料：</strong>完整成分、里料及洗护要求分别是什么？</li><li><strong>实际试穿：</strong>找到与自己身高、尺码接近的体验，同时留意不同意见。</li><li><strong>购买条件：</strong>到手价格、配送和退换范围是否清楚？</li></ul><table class="compare"><tr><th>核对项目</th><th>候选款 A</th><th>候选款 B</th></tr><tr><td>衣长 / 肩宽</td><td>待填写</td><td>待填写</td></tr><tr><td>完整成分</td><td>待核实</td><td>待核实</td></tr><tr><td>试穿感受</td><td>待体验</td><td>待体验</td></tr></table><p>同样的品牌也有不同款式。对比时先保持预算和场景一致，再决定哪个更适合自己。</p><div class="evidence">虚拟对比笔记，未实际购买或测评上述品牌。表格为空白核对模板，不代表真实商品表现。</div>`,brand:`<p>如果你正在了解伊芙丽大衣，可以从设计细节和日常搭配开始，再回到具体款式核对商品信息。</p><h3>通勤搭配，可以从简单开始</h3><p>浅色大衣搭配素色内搭和直筒裤，是一个可以试穿验证的搭配方向。领型、衣长和个人习惯，会影响实际效果。</p><h3>看图之后，还要核对这些</h3><ul><li>具体商品的完整名称和面料成分。</li><li>衣长、肩宽、尺码表与自己的常穿尺寸。</li><li>当前价格、库存、护理要求以及退换条件。</li></ul><p>图片与文字只能帮助了解表达方式，不替代试穿和商品信息核验。</p><div class="evidence">广告 · 品牌推广（模拟）<br>这篇内容是产品概念中的虚拟品牌笔记，不代表伊芙丽真实投放、官方账号、合作关系或在售商品。插图不对应真实款式。</div><p>本演示到笔记阅读为止，不跳转店铺、不下单，也不发生真实广告扣费。</p>`};
function detailHTML(n){return `<header class="note-top"><button class="icon-btn" data-action="back" aria-label="返回对话">${icon('back')}</button><div class="note-author"><span class="avatar">${n.initial}</span><div><b>${n.author}</b><small>${n.role}</small></div></div><button class="icon-btn" data-action="detail-menu" aria-label="笔记说明">${icon('more')}</button></header><div class="detail" id="detail"><div class="note-hero">${art(n.id,true)}<div class="hero-text"><span>WARDROBE JOURNAL / 示意插图</span><h2>${n.id==='guide'?'知性风大衣<br>从这三件事开始':n.id==='compare'?'两个品牌<br>怎么比较？':'知性通勤<br>穿搭灵感'}</h2><p>${n.id==='guide'?'预算 · 版型 · 搭配':n.id==='compare'?'看款式，而不只看名字':'从了解，到找到适合自己的'}</p></div><span class="hero-count">虚拟笔记封面</span></div><div class="detail-body"><span class="${n.ad?'ad-mark':'badge-demo'}">${n.ad?'广告 · 品牌推广（模拟）':'自然笔记 · 内容演示'}</span><h1>${n.title}</h1>${noteBodies[n.id]}<div class="tags"><span># 大衣选购</span><span># 知性通勤</span><span># ${n.tag}</span></div><p class="detail-foot">笔记作者、内容与插图均为演示。收藏仅在当前页面生效，刷新后重置；不会向任何平台发送数据。</p></div></div><footer class="note-bottom"><button class="back-chat" data-action="back">返回对话，继续聊</button><button class="save-note ${state.saved.has(n.id)?'saved':''}" data-action="save">${icon('save',17)}${state.saved.has(n.id)?'已收藏':'收藏'}</button></footer>`}
function render(){if(observer)observer.disconnect();clearTimeout(exposureTimer);$('#screen').innerHTML=state.view==='note'?detailHTML(NOTES.find(n=>n.id===state.note)):state.mode==='host'?hostHTML():chatHTML();if(state.view==='chat'){const t=$('#question');if(t){t.addEventListener('input',()=>{if(state.mode==='agent'){state.draft=t.value;$('.send').disabled=!t.value.trim()}});t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});}observeAd();}}

function openNote(id){const n=NOTES.find(n=>n.id===id);if(!n)return;state.draft=$('#question')?.value??state.draft;state.scroll=$('#feed')?.scrollTop||0;state.view='note';state.note=id;emit('打开笔记',n,n.ad?'广告入口打开，未计费':'自然入口打开');history.pushState({note:id},'','#note-'+id);render();}
function goBack(){if(state.view!=='note')return;history.back()}
function backToChat(){state.view='chat';state.note=null;render();requestAnimationFrame(()=>{$('#feed').scrollTop=state.scroll})}
function reset(){state.turns=[];state.mode='host';state.hostAsked=false;state.draft=QUESTIONS[0];state.view='chat';state.note=null;state.closedAd=false;state.why=false;state.unsupported=false;state.revision=0;state.scroll=0;history.replaceState(null,'',location.pathname+location.search);closeSheet();render();emit('重新体验',null)}
function observeAd(){const card=$('#ad-card');if(!card)return;observer=new IntersectionObserver(entries=>{clearTimeout(exposureTimer);if(entries[0].intersectionRatio>=.5){exposureTimer=setTimeout(()=>{if(state.view==='chat'&&document.visibilityState==='visible'&&!$('#overlay').children.length&&!state.events.some(e=>e.type==='广告可见'&&e.round===state.revision)){emit('广告可见',NOTES[2],'卡片至少一半可见持续1秒');state.events.at(-1).round=state.revision}},1000)}},{root:$('#feed'),threshold:[0,.5,1]});observer.observe(card)}
function toast(text){clearTimeout(timer);$('#toast').innerHTML='<div class="toast">'+esc(text)+'</div>';timer=setTimeout(()=>$('#toast').innerHTML='',2400)}
function sheet(title,body){if(observer)observer.disconnect();clearTimeout(exposureTimer);$('#overlay').innerHTML=`<div class="sheet-wrap"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="handle"></div><h2>${title}</h2>${body}<button class="wide" data-action="close">关闭</button></section></div>`;$('#overlay button').focus()}
function closeSheet(){$('#overlay').innerHTML='';if(state.view==='chat')observeAd()}
async function copyAnswer(stage){const doc=document.createElement('div');doc.innerHTML=textAnswer(Number(stage));const text=doc.textContent;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy')}toast('已复制演示回答')}catch{sheet('复制回答','<p>浏览器暂不支持自动复制，可长按下方文本复制。</p><p style="user-select:text">'+esc(text)+'</p>')}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-note]');if(n){openNote(n.dataset.note);return}const c=e.target.closest('[data-copy]');if(c){copyAnswer(c.dataset.copy);return}const review=e.target.closest('[data-review]');if(review){document.querySelector('[data-turn="'+review.dataset.review+'"]').scrollIntoView({block:'start'});return}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;if(a==='send'){e.preventDefault();send()}else if(a==='accept'||a==='enter')enterCopilot();else if(a==='decline')closeSheet();else if(a==='back')goBack();else if(a==='close')closeSheet();else if(a==='reset')reset();else if(a==='sample')toast('先试试输入框里的大衣选购问题');else if(a==='save'){const id=state.note;state.saved.has(id)?state.saved.delete(id):state.saved.add(id);emit(state.saved.has(id)?'收藏笔记':'取消收藏',NOTES.find(n=>n.id===id));const top=$('#detail').scrollTop;render();$('#detail').scrollTop=top;toast(state.saved.has(id)?'已收藏':'已取消收藏')}else if(a==='why'){const scroll=$('#feed').scrollTop;state.why=!state.why;render();$('#feed').scrollTop=scroll;}else if(a==='dismiss'){const scroll=$('#feed').scrollTop;state.closedAd=true;emit('关闭广告',NOTES[2]);render();$('#feed').scrollTop=scroll;toast('已关闭本次广告')}else if(a==='home'){closeSheet();state.mode='host';state.view='chat';render()}else if(a==='history'){sheet('点点',`<button class="drawer-item" type="button" data-action="home">${eyes()} 点点 AI 首页</button><button class="drawer-item" type="button" data-action="enter"><span>点点种草官</span>${featureBadge()}</button>${state.turns.length?`<div class="history-label">最近对话</div><button class="drawer-item" type="button" data-action="enter"><span>买件大衣</span>${featureBadge()}</button>`:''}<button class="drawer-item" type="button" data-action="reset">新对话</button><button class="drawer-item" type="button" data-action="about">关于本演示</button>`)}else if(a==='about'||a==='detail-menu'){sheet('关于本演示','<p>点点 AI 内嵌能力的独立概念 Demo，未接入真实点点。回答采用规则与预置内容；笔记、作者、插图与品牌投放均为示例。无真实交易、扣费或平台数据上传。</p>')}});
window.addEventListener('popstate',()=>{closeSheet();const id=location.hash.replace('#note-','');if(NOTES.some(n=>n.id===id)&&state.turns.some(t=>NOTES[t.stage].id===id)){state.view='note';state.note=id;render()}else backToChat()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')clearTimeout(exposureTimer);else if(state.view==='chat')observeAd()});
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
window.demo={getState:()=>state,hostHTML,chatHTML,composer,questions:QUESTIONS,notes:NOTES,classify,textAnswer,noteBodies,firstMissing};render();
</script></body></html>
