function needsForm(){const f=state.form;return `<section class="panel"><div class="between"><h2>先明确这次合作要解决什么</h2><div class="actions"><button class="small" data-action="fill">填入示例</button><button class="small" data-action="clearForm">清空需求</button></div></div><p class="sub muted">合作用途与营销目标分别选择；预算按人民币计，不沿用旧版美元估算。</p><form id="needsForm"><div class="form-grid">${field('项目名称','name',f.name,'text','required maxlength="80"')}${field('品牌名称','brand',f.brand,'text','required maxlength="60"')}${field('产品名称','product',f.product,'text','required maxlength="80"')}${select('产品类目','category',f.category,['护肤','底妆','唇妆'])}<div class="full"><label for="selling">产品信息与已核实卖点</label><textarea id="selling" name="selling" required maxlength="1000">${esc(f.selling)}</textarea></div>${field('目标消费者','audience',f.audience,'text','required maxlength="200"')}${field('希望回应的消费疑问','question',f.question,'text','required maxlength="300"')}${select('合作用途','use',f.use,uses)}${select('营销目标','goal',f.goal,goals)}${select('内容形式','format',f.format,['不确定','图文','视频'])}${field('期望发布日期','date',f.date,'date','required')}<fieldset class="full"><legend>内容重点（可多选）</legend><div class="checks">${['产品质地','使用方法','使用场景','包装细节','色号展示'].map(x=>`<label><input type="checkbox" name="focus" value="${x}" ${f.focus.includes(x)?'checked':''}>${x}</label>`).join('')}</div></fieldset>${field('新合作费用上限（元）','budget',f.budget,'number','required min="1" max="1000000" step="0.01"')}${field('独立推广测试上限（元）','media',f.media,'number','required min="0" max="1000000" step="0.01"')}${field('已有内容追加授权上限（元）','license',f.license,'number','required min="0" max="1000000" step="0.01"')}${field('寄样及其他预留（元）','reserve',f.reserve,'number','required min="0" max="1000000" step="0.01"')}<div class="full"><label for="banned">内容边界</label><textarea id="banned" name="banned" maxlength="500">${esc(f.banned)}</textarea></div></div><div class="note">总规划额度为以上四项之和。已有模拟合作的历史费用不再计入新合作费用；授权和推广支出单独管理。日期与费用仍需双方确认。</div><div class="bottom-actions"><span class="sub muted">保存需求后重新评分，已有材料会提示需核对。</span><button class="primary" type="submit">保存并查看达人 →</button></div></form></section>`}
function scoreDetails(c){return `<table><thead><tr><th>维度</th><th>原权重</th><th>示例分</th><th>贡献</th></tr></thead><tbody>${Object.keys(c.weights).map(k=>`<tr><td>${labels[k]}</td><td>${c.weights[k]}%</td><td>${c.dimensions[k]===null?'未知':c.dimensions[k].toFixed(0)}</td><td>${c.contributions[k]===null?'不参与':c.contributions[k].toFixed(1)}</td></tr>`).join('')}</tbody></table>`}
function recommendations(){let r=rank();const anchor=creators.find(c=>c.id===discovery.anchor);if(discovery.q)r=r.filter(c=>[c.name,c.style,...c.aud,...c.angle].join(' ').includes(discovery.q));if(discovery.type)r=r.filter(c=>c.formats.includes(discovery.type));if(anchor)r=r.filter(c=>c.id!==anchor.id).map(c=>({...c,similar:similarity(anchor,c)})).sort((a,b)=>b.similar-a.similar);const w=weightRules[state.form.use==='达人账号发布'?'organic':'paid'][state.form.goal];return `<section class="panel"><div class="between"><div><h2>按用途与目标，解释每一次排序</h2><p class="sub muted">${esc(state.form.use)} · 已确认可行的人选优先；条件未知的人选列为待确认。</p></div>${select('切换营销目标','recGoal',state.form.goal,goals)}</div><div class="weights">${Object.keys(w).map(k=>`<span>${labels[k]} <b>${w[k]}%</b></span>`).join('')}</div><details><summary>评分怎么计算？缺少数据怎么办？</summary><p class="sub">总分＝已知维度分×归一化权重之和。未知维度不计分，另列证据覆盖权重；覆盖权重不是统计置信度。没有成交数据，不预测销量。所有分值与权重是演示假设。</p><p class="sub">内容适配＝40%品类匹配＋30%所选内容重点覆盖率＋30%形式匹配；形式不确定或未选重点，对应子项取中性50%。人群按识别标签覆盖率；未识别或无标签为未知。预算适配＝(1−报价/合作预算)×100。触达、互动、表达为人工设定的0–100示例标注，不是平台指标或行业基准。</p><p class="sub">采购广告素材时自然触达权重为0；发布与素材都要时采用素材导向排序，发布能力仍需核对。切换目标会重算，排序不保证每次改变。</p></details></section><form id="searchForm" class="toolbar"><div class="search"><label for="q">手动搜索其他达人</label><input id="q" name="q" value="${esc(discovery.q)}" placeholder="姓名、内容重点或人群"></div>${select('内容形式','searchType',discovery.type||'不限',['不限','图文','视频'])}<button type="submit">搜索</button><button type="button" data-action="resetSearch">清除筛选</button></form>${anchor?`<div class="notice">与 ${esc(anchor.name)} 相似：品类35%＋形式25%＋内容重点25%＋人群标签15%，采用标签交并比。相似程度不等于需求匹配度。</div>`:''}<div class="between"><p class="sub muted">${r.length} 位符合筛选 · 搜索范围仅6位虚构达人</p><button class="small" data-step="3">查看名单（${selected().length}）→</button></div><div class="cards">${r.map(c=>`<article class="panel creator-card ${state.selected.includes(c.id)?'selected':''}"><div class="person"><div class="avatar">${c.initial}</div><div><h3>${c.name}</h3><span class="badge gray">虚构达人 · ${c.formats.join(' / ')}</span></div></div><div class="between"><span class="sub">${anchor?'相似度':'匹配分'}</span><strong class="score">${anchor?c.similar:c.score??'—'}<small class="sub"> / 100</small></strong></div><p>${c.style}</p><p class="sub">本次交付估价：<strong>${creatorFee(c)===null?'待询价':money(creatorFee(c))}</strong><br>已知证据覆盖权重 ${c.coverage}% · 非置信度</p><span class="badge ${c.pending.length?'warn':''}">${c.pending.length?c.pending.join(' / '):'示例条件满足 · 未发生合作'}</span><details><summary>依据、贡献与待确认项</summary>${scoreDetails(c)}<p class="sub">来源：小红帽人工构造案例，2026-11-09。范围：假设单篇内容；历史转化数据未知。真实报价、档期和权利范围需另行确认。</p></details><div class="actions"><button class="${state.selected.includes(c.id)?'':'primary'} small" data-toggle="${c.id}">${state.selected.includes(c.id)?'移出名单':'加入名单'}</button><button class="small" data-similar="${c.id}">查看相似达人</button></div></article>`).join('')}</div>${!r.length?'<div class="empty"><h2>没有符合条件的人选</h2><p>可以修改需求、预算或搜索条件，系统不会自动放宽约束。</p><button data-action="editNeeds">修改需求</button></div>':''}<details><summary>查看未通过硬约束的人选</summary>${creators.map(c=>({...c,...eligibility(c)})).filter(c=>c.fail.length).map(c=>`<p class="sub">${c.name}：${c.fail.join('、')}</p>`).join('')||'<p class="sub">无</p>'}</details>`}
function shortlist(){const list=selected(),pending=list.filter(c=>eligibility(c).pending.length),bad=list.filter(c=>eligibility(c).fail.length);return `<div class="panel"><h2>确认拟邀约名单与合作预算</h2><p class="sub muted">调整名单不会改变已有合作内容。发布与素材都要的报价包含示例广告使用权费用。</p>${list.map(c=>`<div class="listrow"><div><h3>${c.name}</h3><p class="sub muted">${c.formats.join(' / ')} · ${c.style}</p>${eligibility(c).fail.length?`<span class="badge danger">${eligibility(c).fail.join(' / ')}</span>`:eligibility(c).pending.length?`<span class="badge warn">${eligibility(c).pending.join(' / ')}</span>`:''}</div><strong>${creatorFee(c)===null?'待询价':money(creatorFee(c))}</strong><button class="small" data-toggle="${c.id}">移出名单</button></div>`).join('')||'<p>尚未选择达人。</p>'}<div class="split-budget"><div><span>已知合作费用</span><strong>${money(total())}</strong></div><div><span>合作费用上限</span><strong>${money(state.form.budget)}</strong></div><div><span>推广预算（独立）</span><strong>${money(state.form.media)}</strong></div><div><span>待确认条件</span><strong>${pending.length} 位</strong></div></div><div class="progress"><i style="width:${Math.min(100,total()/Math.max(1,state.form.budget)*100)}%;background:${total()>state.form.budget?'var(--red)':'var(--green)'}"></i></div>${total()>state.form.budget?`<div class="error">合作费用超出 ${money(total()-state.form.budget)}，请移出人选或调整预算。</div>`:''}${pending.length?'<div class="note">未知报价不按免费处理。可以生成询价草稿，不能视为预算已确认或合作已达成。</div>':''}${bad.length?'<div class="error">需求变更后有人选不满足条件，请调整名单。</div>':''}<div class="bottom-actions"><button data-step="2">← 补选或替换达人</button><button class="primary" data-step="4" ${validShortlist()?'':'disabled'}>${pending.length?'生成询价草稿':'生成合作材料'} →</button></div></div>`}
function brief(c){const f=state.form;return `# ${f.brand} · 合作 Brief\n\n致：${c.name}（虚构案例）\n产品：${f.product}\n平台 / 市场 / 语言：小红书 / 中国 / 中文\n合作用途：${f.use}\n目标：${f.goal}\n目标消费者：${f.audience}\n\n## 已提供的产品信息\n${f.selling}\n\n## 内容方向\n形式：${f.format}\n重点：${f.focus.join('、')||'待双方商议'}\n消费疑问：${f.question}\n期望发布日期：${f.date}（待确认）\n\n## 内容边界\n${f.banned}\n真实表达体验，不要求正面评价。清晰说明商业合作关系。\n\n## 待确认\n交付数量、最终报价、档期、修改次数、账号发布与广告素材使用权、使用地域与期限。\n${f.use!=='达人账号发布'?'广告使用权与音乐等素材权利需分别确认。':''}\n\n本材料为模拟合作草稿，不代表已经邀约或达成合作。`}
function invitation(c){const f=state.form;return `你好，${c.name}：\n\n我们是${f.brand}，希望围绕${f.product}，面向${f.audience}开展${f.goal}合作。希望采用${f.format==='不确定'?'适合你的表达形式':f.format}，回应“${f.question}”。\n\n合作用途为${f.use}，期望发布日期为${f.date}，具体档期、报价、交付及授权范围希望与你进一步确认。附件 Brief 可供讨论，欢迎提出你认为更适合的内容方向。\n\n感谢！\n${f.brand}\n\n【虚构示例，仅为沟通草稿；尚未发送】`}
function materialValue(c,kind){return state.edits[kind+'-'+c.id]??(kind==='brief'?brief(c):invitation(c))}
function materialText(){return '# 小红帽 · 合作材料\n\n当前需求版本：'+state.revision+'\n状态：'+(state.briefVersion===state.revision?'已人工核对草稿':'需求变化后待核对草稿')+'；未发送\n\n'+selected().map(c=>'## '+c.name+'\n\n### 邀约草稿\n'+materialValue(c,'invite')+'\n\n'+materialValue(c,'brief')).join('\n\n---\n\n')}
function materials(){if(!validShortlist())return shortlist();return `<div class="panel"><div class="between"><h2>核对合作材料</h2><div class="actions"><button data-action="copyMaterials">复制全部</button><button class="primary" data-action="downloadMaterials">下载全部 Markdown</button></div></div><p class="sub muted">按达人独立编辑，下载与复制使用最后编辑版本。没有实际发送入口。</p>${state.briefVersion!==state.revision?'<div class="note">需求或名单变化后，请核对材料。已编辑内容保留，不会被自动覆盖。</div>':'<div class="notice">已核对本次需求版本的材料；仍为草稿。</div>'}${selected().map(c=>`<details ${selected().length===1?'open':''}><summary><strong>${c.name}</strong> · 独立邀约与 Brief</summary><label for="invite-${c.id}">中文邀约草稿</label><textarea class="editor short" id="invite-${c.id}" data-edit="invite-${c.id}">${esc(materialValue(c,'invite'))}</textarea><label for="brief-${c.id}">中文合作 Brief</label><textarea class="editor" id="brief-${c.id}" data-edit="brief-${c.id}">${esc(materialValue(c,'brief'))}</textarea><div class="actions"><button class="small" data-copy-person="${c.id}">复制该达人材料</button><button class="small" data-download-person="${c.id}">下载该达人材料</button></div></details>`).join('')}<div class="bottom-actions"><button data-step="3">← 调整名单</button><div class="actions"><button data-action="refreshMaterials">按最新需求重建草稿</button><button class="primary" data-action="reviewMaterials">标记为已核对草稿</button></div></div><div class="note">这些材料不会自动产生合作记录。需另行完成真实合作；演示可从合作内容页载入模拟案例。</div></div>`}
function creatorsPage(){return title('CREATOR COLLABORATION','找到能讲清产品的人','小红书 · 中国 · 人民币。当前6位达人均为虚构，匹配分不代表效果概率。')+`<nav class="steps" aria-label="找达人步骤">${['填写需求','挑选达人','名单与预算','合作材料'].map((x,i)=>`<button data-step="${i+1}" class="${state.step===i+1?'active':''}">${i+1} · ${x}</button>`).join('')}</nav>`+[needsForm,recommendations,shortlist,materials][state.step-1]()}
function assetCard(a){const d=diagnose(a);return `<article class="panel asset-card"><div class="asset-cover">${art(a)}<div class="cover-tags"><span class="badge gray">${a.type}${a.type==='视频'?'脚本':''}</span><span class="badge warn">模拟合作</span></div></div><div class="asset-body"><h3>${esc(a.title)}</h3><p class="sub muted">${esc(a.creator)} · ${esc(a.brand)} · ${a.status}</p><div class="asset-stats"><div><strong>${a.views.toLocaleString()}</strong><span>${a.type==='视频'?'模拟播放':'模拟阅读'}</span></div><div><strong>${a.saves}</strong><span>模拟收藏</span></div><div><strong>${a.type==='视频'?a.completion+'%':'—'}</strong><span>${a.type==='视频'?'模拟5秒观看占比':'图文无完播指标'}</span></div></div><div><span class="badge ${d.code==='test'?'':d.code==='no'?'gray':'warn'}">${d.label}</span></div><p class="sub">${d.reason}</p><span class="status-line">${a.improved?'上述数据为原版模拟表现；新版未发布。<br>':''}${d.reviewed?'已查看本版诊断':'待查看诊断'} · ${d.blockers.length?'准备条件待补齐':'示例准备条件齐备'}</span><div class="actions"><button class="primary small" data-asset="${a.id}">查看诊断与行动 →</button></div></div></article>`}
function assetsPage(){const list=state.assets.filter(a=>assetFilter==='全部'||a.type===assetFilter);return title('CREATIVE ASSETS','合作内容，值得怎样继续？','先判断内容与目标是否适配，再检查推广条件；高互动不等于高转化。',`<button data-action="loadAssets">载入模拟合作内容</button>`)+`<div class="toolbar">${select('营销目标','assetGoal',state.form.goal,goals)}${select('笔记形式','assetFilter',assetFilter,['全部','图文','视频'])}<div><span class="badge warn">${state.assets.length} 篇模拟合作 · 非平台同步</span></div></div><div class="cards">${list.map(assetCard).join('')}</div>${!list.length?'<div class="empty"><h2>这里还没有合作内容</h2><p>可以载入模拟案例，体验图文与视频脚本的不同判断。</p></div>':''}<div class="note">模拟表现统一为发布后7天、仅自然流的构造数据；没有实际投放效果。视频仅提供原创脚本分镜，不提供真实拍摄视频，不声称已完成视频理解。</div>`}
function evidenceRows(a){const d=diagnose(a),frames=effectiveFrames(a);return [
{name:a.type==='图文'?'封面与需求表达':'开头与进入主题',status:a.id==='n3'?'需改善':a.id==='n2'&&!a.improved?'需改善':'有证据',quote:frames[0].quote,rule:a.type==='图文'?'判断规则：封面能否识别产品或与受众相关的具体问题。':'判断规则：开头是否交代产品与场景；不使用统一秒数阈值预测广告效果。',at:0},
{name:'产品信息与可信表达',status:a.id==='n3'?'缺少产品证据':'有证据',quote:frames[1].quote,rule:'判断规则：只使用商家提供的质地、包装等事实；不新增功效承诺。当前不构成平台审核或功效核验。',at:1},
{name:'受众与场景适配',status:audienceTags(state.form.audience).length?'需结合目标判断':'信息不足',quote:`目标：${state.form.audience}。案例标签：${a.fitTags.join('、')}。${a.improved?'优化脚本已前置产品与场景，并补充了解产品的行动提示；尚未重拍或发布。':a.formatFacts}`,rule:'判断规则：依据内容表达匹配目标场景。标签不是实际观众画像，无法推断粉丝购买力。',at:1},
{name:'下一步行动',status:a.id==='n2'&&!a.improved?'需改善':a.id==='n3'?'与产品目标不一致':'有证据',quote:frames[2].quote,rule:'判断规则：曝光目标不强制购买CTA；新品认知应提供了解产品的方向；购买目标还需购买路径与衡量条件。',at:2},
{name:'自然表现参考',status:'模拟数据 · 无可比基准',quote:`${a.improved?'以下为原版模拟数据，不能代表修改后表现。':''}发布后7天：${a.type==='视频'?'播放':'阅读'}${a.views}，点赞${a.likes}、收藏${a.saves}、评论${a.comments}。${a.type==='视频'?'脚本对应的模拟5秒观看占比 '+a.completion+'%；不是实际播放测量。':'图文不展示视频完播指标。'}`,rule:'没有同类同窗口基准，不判“优于行业”。自然表现不直接触发付费测试建议，不与推广表现混算。'},
{name:'推广准备条件',status:d.blockers.length?'有待办':'示例条件齐备',quote:d.blockers.length?d.blockers.join('；'):'案例假设已有广告使用权、期限覆盖；相关素材权利已确认或不涉及。',rule:'这是演示记录，不是授权文件验证，也不是平台审核通过。进入就绪状态前仍需人工核对。'}
].map(r=>`<div class="evidence"><div class="evidence-title"><h3>${r.name}</h3><span class="badge ${r.status.includes('不足')||r.status.includes('改善')||r.status.includes('待办')?'warn':'gray'}">${r.status}</span></div><p>${esc(a.evidence?r.quote:'未提供相应内容证据。')}</p><p class="rule">${r.rule}</p>${r.at!==undefined?`<button class="link small" data-frame="${r.at}">定位：${esc(frames[r.at].loc)} →</button>`:''}</div>`).join('')}
function detailPage(){const a=assetById();if(!a)return assetsPage();const d=diagnose(a),frames=effectiveFrames(a);frame=Math.min(frame,frames.length-1);return title('CONTENT DECISION','把判断展开，看见依据',`${esc(a.title)} · ${a.type} · ${esc(a.creator)} · 模拟合作`, '<button data-page="assets">← 返回合作内容</button>')+`<div class="detail-layout"><aside class="panel visual-panel"><div class="art">${art(a,frame)}</div><div class="frame-nav">${frames.map((f,i)=>`<button data-frame="${i}" class="${frame===i?'active':''}">${a.type==='视频'?'片段':'第'} ${i+1}${a.type==='视频'?'':'张'}</button>`).join('')}</div><h4>${frames[frame].loc}</h4><p class="sub">${frames[frame].quote}</p><p class="field-note">${a.type==='视频'?'原创模拟脚本分镜，没有真实视频播放或模型分析。':'原创图文样张，以预置文字作为人工标注依据。'}</p><span class="badge gray">内容版本 ${a.version}</span><div class="section-gap">${select('当前营销目标','detailGoal',state.form.goal,goals)}</div><details><summary>案例条件与模拟修改</summary><p class="sub muted">仅改变演示状态，不代表获得真实权利或实际重拍。</p><label><input id="hasEvidence" type="checkbox" ${a.evidence?'checked':''}>提供内容证据</label>${a.id==='n2'?`<label><input id="improved" type="checkbox" ${a.improved?'checked':''}>采用优化后的模拟脚本</label>`:''}${select('广告使用权','rights',a.rights,['已确认','待确认','已拒绝'])}${field('授权有效至','expiry',a.expiry,'date')}${a.type==='视频'?select('音乐及其他素材权利','music',a.music,['已确认','待确认']):''}<label class="section-gap"><input id="landing" type="checkbox" ${a.landing?'checked':''}>购买路径与衡量条件齐备（模拟）</label><button class="small" data-action="saveAsset">保存条件并重新评估</button></details></aside><div><section class="panel decision ${d.code}"><span class="eyebrow">内容判断 · ${esc(state.form.goal)}</span><h2>${d.label}</h2><p>${d.reason}</p><p><strong>下一步：</strong>${d.next}</p><span class="badge ${d.blockers.length?'warn':''}">${d.blockers.length?'准备状态：待补齐条件':'准备状态：示例条件齐备'}</span>${d.blockers.length?`<p class="sub">${d.blockers.join('；')}。可先保存计划草稿，不能标记为准备就绪。</p>`:''}<div class="actions section-gap"><button class="primary" data-action="reviewAsset">查看并确认本版诊断</button>${d.code==='test'?'<button data-action="prepareAsset">准备测试计划 →</button>':d.code==='optimize'?'<button data-action="copyOptimization">复制优化建议</button>':'<button data-action="copyDiagnosis">复制判断依据</button>'}</div><p class="field-note">${d.reviewed?'已查看本版诊断。':'尚未确认本版诊断。'} 结论由预置标注与规则生成，不是转化预测。</p></section><section class="panel"><div class="between"><h2>证据 → 规则 → 判断</h2><button class="small" data-action="downloadDiagnosis">下载诊断报告</button></div>${evidenceRows(a)}</section></div></div>`}
function planFor(a){return state.plans[a.id]||{asset:a.id,budget:300,license:0,days:3,start:today(),metric:metricFor(),stop:'按上限止损；先核查数据记录与路径，证据不足不自动加预算。',notes:'示例规模仅用于探索，不保证达到平台门槛或形成效果结论。',confirmed:false,stale:false,edited:false}}
function metricFor(){return state.form.goal==='品牌曝光'?'观察推广触达与内容阅读/观看；核对成本和样本量，不将自然阅读当付费增量。':state.form.goal==='新品认知'?'观察推广阅读/观看、围绕产品的有效反馈；有可信口径时记录对应目标成本。':'先确认购买路径与事件记录，再观察点击、订单与成本；点击不等于购买，不能用小样本宣称ROI。'}
function planErrors(a,p){const d=diagnose(a),errors=[...readiness(a,p)],others=Object.values(state.plans).filter(x=>x.asset!==a.id&&x.confirmed&&!x.stale),spent=others.reduce((s,x)=>s+Number(x.budget),0),licensed=others.reduce((s,x)=>s+Number(x.license),0);if(d.code!=='test')errors.push('当前内容判断不支持直接测试');if(!d.reviewed)errors.push('尚未查看并确认本版诊断');if(!Number.isFinite(Number(p.budget))||p.budget<=0)errors.push('测试预算必须大于0');if(Number(p.budget)+spent>Number(state.form.media))errors.push('超出独立推广测试预算');if(!Number.isFinite(Number(p.license))||p.license<0||Number(p.license)+licensed>Number(state.form.license))errors.push('超出追加授权上限或授权费用无效');if(!Number.isInteger(Number(p.days))||p.days<1||p.days>30)errors.push('测试周期需为1–30天整数');if(!p.start||p.start<today())errors.push('开始日期不能早于今天');if(!String(p.metric).trim()||!String(p.stop).trim())errors.push('请填写验证指标与停止条件');return [...new Set(errors)]}
function generatedPlan(a,p){return `# ${state.form.brand} · 推广测试计划\n\n【仅用于演示投放准备，未创建广告、未消耗预算】\n\n项目：${state.form.name}\n产品：${state.form.product}\n笔记：${a.title}\n作者：${a.creator}（模拟合作）\n内容版本：${a.version} / 需求版本：${state.revision}\n目标：${state.form.goal}\n\n## 本轮判断\n${diagnose(a).label}\n${diagnose(a).reason}\n\n## 预算与周期\n媒体测试预算：${money(p.budget)}（独立预算，不占用新合作费）\n追加授权费用：${money(p.license)}（模拟填写）\n开始：${p.start}\n周期：${p.days}天；日均约${money(p.budget/Math.max(1,p.days))}\n这不是平台最低预算或效果承诺，请在实际平台核对。\n\n## 验证指标\n${p.metric}\n\n## 停止与复核条件\n${p.stop}\n\n## 准备条件\n${planErrors(a,p).length?planErrors(a,p).map(x=>'- 待办：'+x).join('\n'):'示例检查完成；实际投放仍需核对授权文件、平台准入与审核。'}\n广告使用权：${a.rights}；有效至${a.expiry}\n音乐等权利：${a.music}\n\n## 补充说明\n${p.notes}\n\n任何预期均待测试验证，不声称已获得真实消耗、订单或ROI。`}
function planText(a,p){return `当前结构化条件：目标 ${state.form.goal}；媒体预算 ${money(p.budget)}；追加授权 ${money(p.license)}；开始 ${p.start}；周期 ${p.days}天。\n这些条件用于校验；下方为最后编辑正文，如有不一致请人工核对。\n\n状态：${p.confirmed&&!p.stale?'已人工核对演示计划，未投放':'计划草稿，待核对'}\n${p.stale?'注意：'+p.staleReason+'；以下编辑正文保留，必须重新核对。\n':''}\n`+(p.edited?p.text:generatedPlan(a,p))}
function preparePage(){const a=assetById();if(!a)return title('CAMPAIGN PREPARATION','推广准备','还没有可评估的内容。')+'<div class="empty"><button data-page="assets">返回合作内容</button></div>';const p=planFor(a),errors=planErrors(a,p),confirmed=Object.values(state.plans).filter(x=>x.confirmed&&!x.stale);return title('CAMPAIGN PREPARATION','把测试条件准备好，再投入','这里生成供人工核对的计划，不连接广告账户，不创建或发布广告。','<button data-action="backDiagnosis">← 返回内容诊断</button>')+`<div class="toolbar">${select('选择合作笔记','planAsset',a.title,state.assets.map(x=>x.title))}<div><span class="badge warn">模拟推广准备</span></div></div><div class="two-col"><section class="panel"><h2>${esc(a.title)}</h2><p class="sub muted">${diagnose(a).label} · 当前目标：${state.form.goal}</p><form id="planForm"><div class="form-grid">${field('本条媒体测试预算（元）','planBudget',p.budget,'number','required min="0.01" max="1000000" step="0.01"')}${field('本条追加授权费（元）','planLicense',p.license,'number','required min="0" max="1000000" step="0.01"')}${field('开始日期','planStart',p.start,'date','required')}${field('测试周期（天）','planDays',p.days,'number','required min="1" max="30" step="1"')}<div class="full"><label for="planMetric">需要验证的指标与口径</label><textarea id="planMetric" required>${esc(p.metric)}</textarea></div><div class="full"><label for="planStop">停止与复核条件</label><textarea id="planStop" required>${esc(p.stop)}</textarea></div><div class="full"><label for="planNotes">补充说明</label><textarea id="planNotes">${esc(p.notes)}</textarea></div></div><div class="bottom-actions"><button type="submit">保存计划草稿</button><button type="button" data-action="checkPlan" class="primary">核对就绪条件</button></div></form><div id="planChecks">${renderPlanChecks(a,p)}</div></section><section class="panel" style="align-self:start"><h2>独立预算与准备状态</h2><div class="contract">新合作：${money(total())} / ${money(state.form.budget)}<br>已核对计划媒体预算：${money(confirmed.reduce((s,x)=>s+Number(x.budget),0))} / ${money(state.form.media)}<br>已核对追加授权：${money(confirmed.reduce((s,x)=>s+Number(x.license),0))} / ${money(state.form.license)}</div><div class="note">默认的300元 / 3天只是可编辑示例，不是行业均价、平台门槛或科学样本量。没有基准时只做探索，不自动给出“追加预算”结论。</div><h3>投放前仍需人工核对</h3><p class="sub">真实授权文件及期限、目标与路径、素材权利、平台广告要求、指标记录和预算设置。</p><p class="sub">准备条件通过不等于平台审核通过。</p>${p.stale?`<div class="note">${esc(p.staleReason)}。已取消原就绪标记，保留编辑正文。</div>`:''}<span id="planStatus" class="badge ${p.confirmed&&!p.stale?'':'warn'}">${p.confirmed&&!p.stale?'演示计划已核对 · 未投放':'草稿 · 尚未就绪'}</span></section></div><section class="panel"><div class="between"><h2>可编辑 Campaign Plan</h2><div class="actions"><button data-action="copyPlan">复制计划</button><button class="primary" data-action="downloadPlan">下载 Markdown</button></div></div><p class="sub muted">正文可独立修改；复制、下载保留最后编辑。金额与日期应同时更新上方结构化字段，预算校验以上方字段为准。</p><textarea id="planEditor" class="editor">${esc(p.edited?p.text:generatedPlan(a,p))}</textarea><div class="bottom-actions"><span class="sub muted">${p.edited?'已编辑正文；条件变更后请同步核对。':'正文根据当前结构化条件生成。'}</span><button data-action="rebuildPlan">按最新条件重建正文</button></div></section>`}
function renderPlanChecks(a,p){const errors=planErrors(a,p);return errors.length?`<div class="error"><strong>还不能标记为准备就绪</strong><ul>${errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:`<div class="notice">当前演示条件通过。最终确认不会创建广告或产生消耗。</div><label><input type="checkbox" id="planAgree">我已核对正文、金额、授权与目标，理解这只是演示计划。</label><button class="primary" data-action="confirmPlan">确认演示计划已核对</button>`}
function diagnosisText(a){const d=diagnose(a);return `# 小红帽 · 内容诊断\n\n笔记：${a.title}\n类型：${a.type}\n案例性质：模拟合作，预置人工标注与规则\n目标：${state.form.goal}\n内容版本：${a.version}\n\n## 结论\n${d.label}\n${d.reason}\n\n## 准备状态\n${d.blockers.join('；')||'示例条件齐备，实际条件待核验'}\n\n## 证据\n${a.evidence?effectiveFrames(a).map(f=>f.loc+'：'+f.quote).join('\n'):'内容证据缺失'}\n\n## 下一步\n${d.next}\n\n## 不确定性\n自然表现为构造样例，缺少可比基准；受众标签不是实际画像；不预测转化或ROI。\n`}
function render(){for(const p of Object.values(state.plans)){const a=assetById(p.asset);if(p.confirmed&&(!a||planErrors(a,p).length)){p.confirmed=false;p.stale=true;p.staleReason='准备条件已变化或过期，请重新核对';save()}}const page=state.page==='detail'?'assets':state.page,names={overview:'工作台',creators:'找达人',assets:'合作内容',prepare:'推广准备'};$('.navigation').innerHTML=Object.entries(names).map(([k,v],i)=>`<button data-page="${k}" class="${page===k?'active':''}" ${page===k?'aria-current="page"':''}><span>${['▦','♧','▧','↗'][i]}</span>${v}</button>`).join('');$('#breadcrumb').textContent=names[page];$('#app').innerHTML=(storageWarning?`<div class="note">${storageWarning}</div>`:'')+({overview,creators:creatorsPage,assets:assetsPage,detail:detailPage,prepare:preparePage}[state.page]||overview)();bindForms()}
function readPlanForm(){const a=assetById(),p={...planFor(a)},b=$('#planBudget');if(!b)return p;p.budget=Number(b.value);p.license=Number($('#planLicense').value);p.start=$('#planStart').value;p.days=Number($('#planDays').value);p.metric=$('#planMetric').value;p.stop=$('#planStop').value;p.notes=$('#planNotes').value;p.confirmed=false;p.stale=false;state.plans[a.id]=p;save();if($('#planStatus')){$('#planStatus').textContent='草稿 · 修改后需重新核对';$('#planStatus').className='badge warn'}return p}
function bindForms(){if($('#needsForm'))$('#needsForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),f=Object.fromEntries(fd);f.focus=fd.getAll('focus');for(const k of ['budget','media','license','reserve'])f[k]=Number(f[k]);state.form=f;invalidate('项目需求或预算已更新');state.step=2;save();render();window.scrollTo(0,0)};if($('#searchForm'))$('#searchForm').onsubmit=e=>{e.preventDefault();discovery.q=$('#q').value.trim();discovery.type=$('#searchType').value==='不限'?'':$('#searchType').value;render()};for(const id of ['recGoal','assetGoal','detailGoal'])if($('#'+id))$('#'+id).onchange=e=>setGoal(e.target.value);if($('#assetFilter'))$('#assetFilter').onchange=e=>{assetFilter=e.target.value;render()};if($('#planAsset'))$('#planAsset').onchange=e=>{state.active=state.assets.find(a=>a.title===e.target.value).id;save();render()};document.querySelectorAll('[data-edit]').forEach(el=>el.oninput=()=>{state.edits[el.dataset.edit]=el.value;state.briefVersion=0;save()});if($('#planForm')){$('#planForm').onsubmit=e=>{e.preventDefault();readPlanForm();render();toast('计划草稿已保存，未创建广告')};$('#planForm').oninput=()=>{const p=readPlanForm(),a=assetById();$('#planChecks').innerHTML=renderPlanChecks(a,p);if(!p.edited)$('#planEditor').value=generatedPlan(a,p)}}if($('#planEditor'))$('#planEditor').oninput=e=>{const a=assetById(),p={...planFor(a),text:e.target.value,edited:true,confirmed:false};state.plans[a.id]=p;save();if($('#planStatus')){$('#planStatus').textContent='草稿 · 修改后需重新核对';$('#planStatus').className='badge warn'}}}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已复制最后编辑内容')}catch{showModal('<h2>请手动复制</h2><p>当前环境无法自动复制，可选中以下完整内容。</p><textarea id="copyFallback" class="editor">'+esc(text)+'</textarea>');$('#copyFallback').focus();$('#copyFallback').select()}}
function download(text,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('已生成下载，包含最后编辑内容')}
function showModal(html){$('#modal').innerHTML=`<div class="panel"><div class="between"><span class="eyebrow">LITTLE RED HOOD</span><button data-action="closeModal" aria-label="关闭窗口">×</button></div>${html}</div>`;$('#modal').classList.remove('hidden');$('#modal button').focus()}
function confirmBox(message,action){showModal(`<h2>${message}</h2><p class="sub muted">此操作会修改本浏览器的演示记录，不影响旧版 TikTok 项目。</p><div class="actions"><button data-action="closeModal">取消</button><button class="primary" data-action="${action}">确认</button></div>`)}
function about(){showModal(`<h2>数据与能力边界</h2><p>小红帽是独立作品，不属于小红书官方产品。当前采用规则评分、预置标注、模板生成和浏览器本地保存，没有模型、平台 API、邮件服务或真实投放。</p><table><tr><th>类型</th><th>本期如何使用</th></tr><tr><td>真实公开资料</td><td>仅用于平台机制研究，见下方来源；不是达人数据库。</td></tr><tr><td>经授权的平台数据</td><td>未接入。</td></tr><tr><td>用户填写</td><td>需求、预算、编辑草稿；不代表平台认证。</td></tr><tr><td>模拟数据</td><td>6位达人、3条合作笔记、报价与表现、权利状态。</td></tr><tr><td>规则结果</td><td>匹配分、内容判断、预算及准备条件。</td></tr><tr><td>模型推断</td><td>未实现。分镜来自人工编写，不是实时视频理解。</td></tr></table><h3>研究依据 · 核查于2026-11-09</h3><ul class="source-list"><li><a href="https://ad.xiaohongshu.com/next_help/docs/da701b07cc62d5a9ae9f3ea002f1f59d" target="_blank" rel="noopener">聚光：笔记抽屉笔记筛选功能说明</a>：按营销场景看指标，注意数据权限与统计口径。</li><li><a href="https://ad.xiaohongshu.com/next_help/docs/d6e54d83d20628f893180ec49b790cbd" target="_blank" rel="noopener">聚光：搜索工具与相关性预检</a>：平台已有内容匹配与优化能力。小红帽验证新手的决策理解与行动引导。</li></ul><p class="sub muted">具体权重、判断树与费用均为本作品假设，没有使用公司内部数据。公开资料不支持推断真实效果。</p><div class="doclinks"><a href="docs/product.md">产品说明</a><a href="docs/technical.md">技术方案</a></div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.step){const step=Number(b.dataset.step);if(step===4&&!validShortlist()){toast('名单为空、超预算或存在不满足条件的人选，请先调整');return}state.step=step;go('creators');return}if(b.dataset.asset){openAsset(b.dataset.asset);return}if(b.dataset.frame!==undefined){frame=Number(b.dataset.frame);render();return}if(b.dataset.toggle){const id=b.dataset.toggle;state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];state.briefVersion=0;save();render();return}if(b.dataset.similar){discovery.anchor=b.dataset.similar;discovery.q='';discovery.type='';render();return}if(b.dataset.copyPerson||b.dataset.downloadPerson){const c=creators.find(c=>c.id===(b.dataset.copyPerson||b.dataset.downloadPerson)),text=materialValue(c,'invite')+'\n\n'+materialValue(c,'brief');b.dataset.copyPerson?copyText(text):download(text,'小红帽-'+c.name+'-合作草稿.md');return}const action=b.dataset.action,a=assetById();switch(action){case 'about':about();break;case 'closeModal':$('#modal').classList.add('hidden');break;case 'reset':confirmBox('重置为初始模拟项目？','doReset');break;case 'doReset':state=initial();discovery={q:'',type:'',anchor:null};save();$('#modal').classList.add('hidden');render();break;case 'new':confirmBox('新建空白项目并清除本地演示记录？','doNew');break;case 'doNew':state=initial();state.assets=[];state.form={...state.form,name:'',brand:'',product:'',selling:'',audience:'',question:'',focus:[]};save();$('#modal').classList.add('hidden');render();break;case 'editNeeds':state.step=1;go('creators');break;case 'fill':state.form=clone(example);invalidate('已填入示例需求');render();break;case 'clearForm':state.form={...state.form,name:'',brand:'',product:'',selling:'',audience:'',question:'',focus:[],banned:'',date:''};invalidate('需求已清空');render();break;case 'resetSearch':discovery={q:'',type:'',anchor:null};render();break;case 'copyMaterials':copyText(materialText());break;case 'downloadMaterials':download(materialText(),'小红帽-V3-合作材料.md');break;case 'reviewMaterials':state.briefVersion=state.revision;save();render();break;case 'refreshMaterials':confirmBox('用最新需求替换已编辑的合作草稿？','doRefreshMaterials');break;case 'doRefreshMaterials':state.edits={};state.briefVersion=0;save();$('#modal').classList.add('hidden');render();break;case 'loadAssets':if(state.assets.length){toast('已有3篇模拟案例；如需恢复初始状态，请使用重置演示');break}state.assets=clone(assetSeed);state.active='n1';save();go('assets');break;case 'reviewAsset':a.reviewed=state.revision+'-'+a.version;save();render();toast('已记录本版诊断核对，不代表真实效果验证');break;case 'prepareAsset':go('prepare');break;case 'backDiagnosis':go('detail');break;case 'saveAsset':{a.evidence=$('#hasEvidence').checked;if($('#improved')){a.improved=$('#improved').checked;a.status=a.improved?'优化脚本 · 尚未重拍/发布':'脚本待修改 · 模拟'}a.rights=$('#rights').value;a.expiry=$('#expiry').value;if($('#music'))a.music=$('#music').value;a.landing=$('#landing').checked;a.version++;a.reviewed=null;const p=state.plans[a.id];if(p){p.confirmed=false;p.stale=true;p.staleReason='内容或授权条件已变化，需重新核对正文与条件'}save();render();toast('已重评内容并取消旧计划就绪标记');break}case 'copyOptimization':case 'copyDiagnosis':copyText(diagnosisText(a));break;case 'downloadDiagnosis':download(diagnosisText(a),'小红帽-'+a.id+'-诊断.md');break;case 'checkPlan':readPlanForm();render();break;case 'confirmPlan':{const p=state.plans[a.id]||planFor(a);const errors=planErrors(a,p);if(errors.length||!$('#planAgree')?.checked){toast(errors[0]||'请先勾选人工核对声明');break}p.confirmed=true;p.stale=false;state.plans[a.id]=p;save();render();toast('演示计划已核对，未创建广告或产生消耗');break}case 'copyPlan':{const p=state.plans[a.id]||planFor(a);copyText(planText(a,p));break}case 'downloadPlan':{const p=state.plans[a.id]||planFor(a);download(planText(a,p),'小红帽-'+a.id+'-推广测试计划.md');break}case 'rebuildPlan':confirmBox('用当前条件替换已编辑计划正文？','doRebuildPlan');break;case 'doRebuildPlan':{const p=readPlanForm();p.edited=false;p.text='';p.confirmed=false;p.stale=false;state.plans[a.id]=p;save();$('#modal').classList.add('hidden');render();break}}});
