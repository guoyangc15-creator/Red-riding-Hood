<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="820" viewBox="0 0 1160 820"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#76917d"/></marker></defs><rect width="1160" height="820" fill="#f8f7f3"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#253831"><text x="55" y="58" font-size="25" font-weight="700">小红帽 V3 · 从经营概览到内容决策</text><text x="55" y="88" font-size="14" fill="#727e76">用于 AI coding 作品说明 · 中国 / 小红书场景 · 独立模拟演示</text><g stroke="#76917d" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M580 189 V225 H210 V255"/><path d="M580 189 V255"/><path d="M580 339 V390"/><path d="M580 462 V490 H175 V520"/><path d="M580 462 V490 H445 V520"/><path d="M580 462 V490 H715 V520"/><path d="M580 462 V490 H985 V520"/><path d="M175 600 V665"/><path d="M445 600 V620 H1090 V300 H790"/></g><g stroke="#dce4d7" fill="white"><rect x="360" y="125" width="440" height="65" rx="12" fill="#eaf0e4"/><rect x="60" y="255" width="300" height="85" rx="12"/><rect x="395" y="255" width="395" height="85" rx="12"/><rect x="395" y="390" width="395" height="72" rx="12"/><rect x="55" y="520" width="240" height="80" rx="12" fill="#eaf0e4"/><rect x="325" y="520" width="240" height="80" rx="12" fill="#faf0dc"/><rect x="595" y="520" width="240" height="80" rx="12"/><rect x="865" y="520" width="240" height="80" rx="12"/><rect x="55" y="665" width="510" height="85" rx="12" fill="#eaf0e4"/></g><g text-anchor="middle"><text x="580" y="152" font-size="19" font-weight="700">工作台 overview</text><text x="580" y="176" font-size="13">项目与预算 · 合作进度 · 已有内容 · 下一步建议</text><text x="210" y="285" font-size="18" font-weight="700">找达人与准备合作</text><text x="210" y="310" font-size="13">需求 → 推荐 → 名单预算 → Brief</text><text x="592" y="285" font-size="18" font-weight="700">合作内容 · 决策中心</text><text x="592" y="310" font-size="13">图文样张 / 视频脚本 → 内容证据与目标</text><text x="592" y="419" font-size="18" font-weight="700">基于证据与规则判断</text><text x="592" y="443" font-size="13">具体位置 · 判断依据 · 不确定性 · 行动</text><text x="175" y="549" font-size="17" font-weight="700">建议小规模测试</text><text x="175" y="577" font-size="13">内容具备测试价值</text><text x="445" y="549" font-size="17" font-weight="700">先优化内容</text><text x="445" y="577" font-size="13">修改后重新评估</text><text x="715" y="549" font-size="17" font-weight="700">本轮不推广</text><text x="715" y="577" font-size="13">保留自然传播价值</text><text x="985" y="549" font-size="17" font-weight="700">信息不足</text><text x="985" y="577" font-size="13">先补证据，再作判断</text><text x="310" y="696" font-size="18" font-weight="700">推广准备 → 人工核对计划</text><text x="310" y="724" font-size="13">授权 / 期限 / 音乐 / 路径 / 独立预算 / 验证指标</text></g><text x="60" y="365" font-size="12" fill="#727e76">实际合作不自动完成；案例需显式载入。</text><text x="615" y="697" font-size="16" fill="#916629">缺少授权或超预算：阻断就绪状态</text><text x="615" y="724" font-size="13" fill="#727e76">可保存草稿，不代表已经创建广告。</text><text x="55" y="790" font-size="12" fill="#727e76">六位达人与三条合作均为模拟；运行时为规则与模板，未调用平台 API 或多模态模型。</text></g></svg>
