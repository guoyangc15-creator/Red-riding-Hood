const RECO_RULES={guide:'预算与品类匹配：千元预算、大衣、多品牌选购。截图中 1040 元和 1177 元的款式超预算；价格未实时核验。',compare:'品牌匹配、品类不完全匹配：同时提到伊芙丽与太平鸟，但在讨论羽绒服。它是提问帖，不是大衣测评结论。',brand:'品牌、品类和内容形式匹配：伊芙丽、大衣、穿搭展示。仅用于广告位演示，不表示截图中的笔记真实投放或已获商业授权。'};
function detailHTML(n){const dims=n.id==='guide'?{w:2004,h:1484,split:1110}:{w:1984,h:1480,split:1099};const image=NOTE_IMAGES[n.id];return `<div class="detail native-detail" id="detail" aria-label="${esc(n.title)}原始截图">${n.id==='brand'?`<img class="native-portrait" src="${image}" alt="用户提供的伊芙丽女装视频笔记截图；本页不播放视频，图内控件仅为截图" decoding="async">`:`<div class="native-slice" style="aspect-ratio:${dims.split}/${dims.h}"><img src="${image}" style="width:${dims.w/dims.split*100}%" alt="${esc(n.title)}原图封面" decoding="async"></div><div class="native-slice" style="aspect-ratio:${dims.w-dims.split}/${dims.h}"><img src="${image}" style="width:${dims.w/(dims.w-dims.split)*100}%;left:-${dims.split/(dims.w-dims.split)*100}%" alt="${esc(n.title)}原图正文、作者与互动信息；图内控件仅为截图" decoding="async"></div>`}</div><footer class="native-return"><button type="button" data-action="back">${icon('back',16)}回到点点种草</button></footer>`}
function render(){if(observer)observer.disconnect();clearTimeout(exposureTimer);$('#screen').innerHTML=state.view==='note'?detailHTML(NOTES.find(n=>n.id===state.note)):state.mode==='host'?hostHTML():chatHTML();if(state.view==='chat'){const t=$('#question');if(t){t.addEventListener('input',()=>{if(state.mode==='agent'){state.draft=t.value;$('.send').disabled=!t.value.trim()}});t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});}observeAd();}}
function send(){if(state.mode==='host'){state.hostAsked=true;state.draft=QUESTIONS[0];render();emit('普通对话提问',null,QUESTIONS[0]);invite();return;}const question=$('#question')?.value.trim()||state.draft.trim();if(!question)return;const stage=classify(question);if(stage<0){toast('请使用本轮预填的选购问题');state.draft=QUESTIONS[firstMissing()]||'';render();return}const expected=firstMissing();if(stage>expected){toast('先完成当前问题');return}const existing=state.turns.find(t=>t.stage===stage);if(existing){state.draft=QUESTIONS[expected]||'';render();requestAnimationFrame(()=>document.querySelector('[data-turn="'+stage+'"]').scrollIntoView({block:'start'}));return}$('#question')?.blur();state.turns.push({id:state.revision++,stage,question});state.unsupported=false;state.draft=QUESTIONS[firstMissing()]||'';emit('发送问题',NOTES[stage],question);render();requestAnimationFrame(()=>document.getElementById('turn-'+(state.revision-1)).scrollIntoView({block:'start'}));}
function openNote(id){const n=NOTES.find(n=>n.id===id);if(!n)return;state.draft=$('#question')?.value??state.draft;state.scroll=$('#feed')?.scrollTop||0;state.view='note';state.note=id;emit('打开笔记',n,n.ad?'广告入口打开，未计费':'自然入口打开');history.pushState({note:id},'','#note-'+id);render();}
function goBack(){if(state.view!=='note')return;history.back()}
function backToChat(){state.view='chat';state.note=null;render();requestAnimationFrame(()=>{$('#feed').scrollTop=state.scroll})}
function reset(){state.turns=[];state.mode='host';state.hostAsked=false;state.draft=QUESTIONS[0];state.view='chat';state.note=null;state.closedAd=false;state.why=false;state.unsupported=false;state.revision=0;state.scroll=0;history.replaceState(null,'',location.pathname+location.search);closeSheet();render();emit('重新体验',null)}
function observeAd(){const card=$('#ad-card');if(!card)return;observer=new IntersectionObserver(entries=>{clearTimeout(exposureTimer);if(entries[0].intersectionRatio>=.5){exposureTimer=setTimeout(()=>{if(state.view==='chat'&&document.visibilityState==='visible'&&!$('#overlay').children.length&&!state.events.some(e=>e.type==='广告可见'&&e.round===state.revision)){emit('广告可见',NOTES[2],'卡片至少一半可见持续1秒');state.events.at(-1).round=state.revision}},1000)}},{root:$('#feed'),threshold:[0,.5,1]});observer.observe(card)}
function toast(text){clearTimeout(timer);$('#toast').innerHTML='<div class="toast">'+esc(text)+'</div>';timer=setTimeout(()=>$('#toast').innerHTML='',2400)}
function sheet(title,body){if(observer)observer.disconnect();clearTimeout(exposureTimer);$('#overlay').innerHTML=`<div class="sheet-wrap"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="handle"></div><h2>${title}</h2>${body}<button class="wide" data-action="close">关闭</button></section></div>`;$('#overlay button').focus()}
function closeSheet(){$('#overlay').innerHTML='';if(state.view==='chat')observeAd()}
async function copyAnswer(stage){const doc=document.createElement('div');doc.innerHTML=textAnswer(Number(stage));const text=doc.textContent;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy')}toast('已复制演示回答')}catch{sheet('复制回答','<p>浏览器暂不支持自动复制，可长按下方文本复制。</p><p style="user-select:text">'+esc(text)+'</p>')}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-note]');if(n){openNote(n.dataset.note);return}const c=e.target.closest('[data-copy]');if(c){copyAnswer(c.dataset.copy);return}const review=e.target.closest('[data-review]');if(review){document.querySelector('[data-turn="'+review.dataset.review+'"]').scrollIntoView({block:'start'});return}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;if(a==='send'){e.preventDefault();send()}else if(a==='accept'||a==='enter')enterCopilot();else if(a==='decline')closeSheet();else if(a==='back')goBack();else if(a==='close')closeSheet();else if(a==='reset')reset();else if(a==='sample')toast('先试试输入框里的大衣选购问题');else if(a==='save'){const id=state.note;state.saved.has(id)?state.saved.delete(id):state.saved.add(id);emit(state.saved.has(id)?'收藏笔记':'取消收藏',NOTES.find(n=>n.id===id));const top=$('#detail').scrollTop;render();$('#detail').scrollTop=top;toast(state.saved.has(id)?'已收藏':'已取消收藏')}else if(a==='why'){const scroll=$('#feed').scrollTop;const id=e.target.closest('[data-reason]').dataset.reason;state.why=state.why===id?null:id;render();$('#feed').scrollTop=scroll;}else if(a==='dismiss'){const scroll=$('#feed').scrollTop;state.closedAd=true;emit('关闭广告',NOTES[2]);render();$('#feed').scrollTop=scroll;toast('已关闭本次广告')}else if(a==='home'){closeSheet();state.mode='host';state.view='chat';render()}else if(a==='history'){sheet('点点',`<button class="drawer-item" type="button" data-action="home">${eyes()} 点点 AI 首页</button><button class="drawer-item" type="button" data-action="enter"><span>点点种草官</span>${featureBadge()}</button>${state.turns.length?`<div class="history-label">最近对话</div><button class="drawer-item" type="button" data-action="enter"><span>买件大衣</span>${featureBadge()}</button>`:''}<button class="drawer-item" type="button" data-action="reset">新对话</button><button class="drawer-item" type="button" data-action="about">关于本演示</button>`)}else if(a==='about'||a==='detail-menu'){sheet('关于本演示','<p>点点 AI 内嵌能力的独立概念 Demo，未接入真实点点。三篇笔记来自用户提供的原始截图，图内日期、价格、作者与互动量不是实时数据；截图不代表已获商业授权。第三篇仅借用截图演示广告位置，不代表真实广告投放；视频不播放，图内控件不可操作。</p><p>本版每轮一篇，是三个预置样例的演示安排，未接入真实内容池、推荐模型、竞价、计费或归因。自然内容不受广告预算影响，没有真实交易、扣费或平台数据上传。</p>')}});
window.addEventListener('popstate',()=>{closeSheet();const id=location.hash.replace('#note-','');if(NOTES.some(n=>n.id===id)&&state.turns.some(t=>NOTES[t.stage].id===id)){state.view='note';state.note=id;render()}else backToChat()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')clearTimeout(exposureTimer);else if(state.view==='chat')observeAd()});
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
window.demo={getState:()=>state,hostHTML,chatHTML,composer,questions:QUESTIONS,notes:NOTES,classify,textAnswer,detailHTML,card,recommendationRules:RECO_RULES,firstMissing};render();
</script></body></html>
