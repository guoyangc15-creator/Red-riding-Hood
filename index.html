function card(c){const chosen=state.selected.includes(c.id);return`<article class="card ${chosen?'chosen':''}" data-card="${c.id}"><div class="person"><div class="avatar" style="background:${c.color}">${c.name.split(' ').map(v=>v[0]).join('')}</div><div><h3>${c.name}</h3><div class="handle">TikTok · 虚构示例达人</div></div></div><div class="stats"><div><strong>${(c.followers/1000).toFixed(1)}k</strong><small>示例粉丝量</small></div><div><strong>${money(c.fee)}</strong><small>示例单条合作报价</small></div></div><p class="reason">${esc(reason(c))}</p><div class="metrics"><div class="metric"><span>内容匹配</span><b>${Math.round(100*c.rel/c.total)}% 同类内容</b></div><div class="metric"><span>人群匹配</span><b>${esc(c.aud.join(' / '))}</b></div><div class="metric"><span>历史互动</span><b>近 5 篇均值 ${avg(c).toLocaleString()}</b></div><div class="metric"><span>商业适配</span><b>商业内容 ${c.commercial}%</b></div><div class="metric"><span>预算参考</span><b>CPE ${money(c.fee/avg(c))}</b></div></div><details><summary>查看依据</summary><p>${c.style}。代表内容：${c.title}（虚构标题）。</p><p>近30天 ${c.total} 篇中，相关内容 ${c.rel} 篇。近5篇同类型内容赞、藏、评合计：${c.eng.join('、')}。CPE为报价÷历史平均互动，不是未来效果预测。</p><p>内容形式：${c.formats.join('、')}。本次形式${state.form.format==='不确定'?'待商家与达人确认':c.formats.includes(state.form.format)?'匹配':'需协商'}。受众为模拟标签，不是已核验粉丝画像。</p></details><div class="pending">报价、档期与授权待确认</div><div class="action"><span class="pill">${chosen?'已加入名单':'候选达人'}</span><button class="small ${chosen?'':'primary'}" data-toggle="${c.id}">${chosen?'移出名单':'加入名单'}</button></div></article>`}
function summary(){return`<div class="summary"><div class="grow"><strong>${esc(state.form.brand)}</strong> · ${esc(state.form.product)} <span class="muted">／ ${esc(state.form.category)} · ${esc(state.form.format)} · ${esc(state.form.concern)}</span></div><span class="pill">总预算 ${money(state.form.budget)}</span><button class="link" data-go="1">修改需求</button></div>`}
function renderRecommendations(){const r=rank();return`<div class="intro"><h1>挑选达人</h1></div>${summary()}<div class="recommend">${r.length} 位预算内候选 · 优先匹配 ${esc(state.form.audience)} / ${esc(state.form.concern)}</div>${r.length?`<div class="cards">${r.map(card).join('')}</div>`:`<div class="empty"><h2>当前预算下，暂无匹配候选</h2><p class="muted">此示例库该品类最低报价为 ${money(Math.min(...creators.filter(c=>c.cats.includes(state.form.category)).map(c=>c.fee)))}。可以调整预算或品类。</p><button data-go="1">调整合作需求</button></div>`}`}
function renderList(){return`<div class="intro"><h1>确认名单与预算</h1></div>${summary()}<div class="layout"><section class="panel"><div class="section-title"><h2>拟邀约名单 · ${selected().length} 位</h2><button class="small" data-go="2">返回补选 / 替换</button></div>${selected().length?selected().map(c=>`<div class="listrow"><div class="person"><div class="avatar" style="background:${c.color}">${c.name[0]}</div><div><h3>${c.name}</h3><div class="smalltext muted">${esc(c.style)}</div><div class="field-note">建议回应：${esc(state.form.concern)} · ${esc(state.form.format)}</div></div></div><strong>${money(c.fee)}</strong><div class="actions"><button class="small" data-toggle="${c.id}">移除</button></div></div>`).join(''):`<p class="muted">名单还是空的，请先返回选择达人。</p>`}<div class="note" style="margin-top:24px">示例名单 · 报价与档期待确认</div></section><aside class="panel side"><div class="kicker">合作预算</div><div class="budget">${money(total())}</div><div class="smalltext">合作预算上限 ${money(state.form.budget)}</div><div class="track"><i style="width:${Math.min(100,total()/state.form.budget*100)}%;background:${total()>state.form.budget?'var(--red)':'var(--green)'}"></i></div><strong>${total()>state.form.budget?'超出 '+money(total()-state.form.budget):'剩余 '+money(state.form.budget-total())}</strong><div class="divider"></div><p class="smalltext">每人 1 条内容；不含寄样、税费、投放及额外授权。</p></aside></div>${total()>state.form.budget?'<div class="error" role="alert">当前名单已超预算，请移除或替换达人后继续。</div>':''}`}
function invitation(c,lang){const f=state.form;if(lang==='zh')return`您好 ${c.name}，\n\n我们是 ${f.brand}，正在为美国市场的 ${f.product} 寻找内容合作伙伴。您擅长的${c.style}与本次方向相关，希望邀请您围绕「${f.concern}」创作${f.format==='不确定'?'适合您风格的内容':f.format+'内容'}。\n\n产品信息：${f.selling}\n期望发布时间：${f.date}\n我们暂按 ${money(c.fee)} / 条规划（演示预算，待您确认）。\n\n请问您近期是否有档期？也希望了解您的正式报价、修改次数、商业合作披露方式，以及内容使用授权范围和是否包含广告投放授权。\n\n我们尊重您的真实体验与创作表达，期待进一步沟通。`;
return`Hi ${c.name},\n\nWe are ${english(f.brand,'brand name')}, exploring a paid TikTok collaboration for ${english(f.englishProduct.trim()||f.product,'product name')} in the US market. We would love to discuss ${fLabels[f.format]} focused on ${focusList(f.concern).map(x=>fLabels[x]||x).join(' and ')}.\n\nTarget publication date: ${f.date}\nPlanning budget: ${money(c.fee)} for one post (demo estimate; subject to your quote).\n\nWould you be available? Please share your rate, revision terms, disclosure approach and content usage rights, including whether paid advertising rights are included. We welcome your creative input and honest experience.\n\nProduct details:\n${english(f.selling,'product details')}\n\nThank you!\n${english(f.brand,'brand name')}`}

Brand: ${english(f.brand,'brand name')}
Product: ${english(f.englishProduct||f.product,'product name')}
Market / Platform / Language: United States / TikTok / English

function editor(key,text){return esc(state.edits[key]??text)}
function renderMaterials(){const c=selected().find(x=>x.id===state.activeCreator)||selected()[0];state.activeCreator=c.id;return`<div class="intro"><h1>准备并发送合作材料</h1></div><div class="materials"><section class="panel"><div class="tabs"><button data-tab="invite" class="${state.tab==='invite'?'active':''}">中英邀约话术</button><button data-tab="brief" class="${state.tab==='brief'?'active':''}">英文产品 Brief</button></div>${state.tab==='invite'?`<label for="creatorSelect">选择达人</label><select id="creatorSelect">${selected().map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.name} · ${money(x.fee)}</option>`).join('')}</select><div class="editor-label"><strong>英文邀约</strong><button class="small" data-copy="en-${c.id}">复制英文</button></div><textarea class="editor" aria-label="英文邀约" data-edit="en-${c.id}">${editor('en-'+c.id,invitation(c,'en'))}</textarea><div class="editor-label"><strong>中文对照</strong><button class="small" data-copy="zh-${c.id}">复制中文</button></div><textarea class="editor" aria-label="中文邀约" data-edit="zh-${c.id}">${editor('zh-'+c.id,invitation(c,'zh'))}</textarea>`:`<div class="editor-label"><strong>英文产品合作说明</strong><button class="small" data-copy="brief">复制 Brief</button></div><textarea class="editor" style="min-height:650px" aria-label="产品 Brief" data-edit="brief">${editor('brief',briefText())}</textarea>`}</section><aside class="panel side"><h2>核对并编辑材料</h2><p>${selected().length} 位达人 · ${money(total())}</p><p class="smalltext muted">中英邀约 + 英文产品 Brief</p><button class="small" id="downloadAll">下载全部材料</button><div class="divider"></div><p class="field-note">示例采用预置英文，不提供自动翻译。出现 ENGLISH REQUIRED 时，请补齐英文后再模拟邀约。</p><p class="field-note">更改需求或名单将重置文案编辑。总览 Brief 会用于未单独编辑的达人版本；已独立编辑的版本须分别核对。</p></aside></div>`}
function render(){document.querySelector('.steps').innerHTML=['填写需求','查看推荐','确认名单','合作材料'].map((n,i)=>`<div class="step ${state.step===i+1?'active':state.step>i+1?'done':''}"><b>${state.step>i+1?'✓':i+1}</b>${n}</div>`).join('');$('#app').innerHTML=state.step===1?renderForm():state.step===2?renderRecommendations():state.step===3?renderList():renderMaterials();$('#bar').innerHTML=state.step===1?`<div><strong>填写合作需求</strong><div class="sub">可使用示例快速体验</div></div><button class="primary" type="submit" form="briefForm">查看推荐达人 →</button>`:`<div><strong>${state.selected.length} 位 · ${money(total())}</strong><div class="sub">${total()>state.form.budget?'超预算 '+money(total()-state.form.budget):'剩余预算 '+money(state.form.budget-total())} · USD</div></div><div class="actions"><button data-go="${state.step===4?3:state.step===3?2:1}">${state.step===4?'调整名单':'上一步'}</button>${state.step===4?'<button id="downloadBtn">下载材料</button><button id="emailBtn">发给自己</button><button class="primary" id="inviteBtn">邀约达人</button>':`<button class="primary" data-go="${state.step+1}" ${!state.selected.length||(state.step===3&&total()>state.form.budget)?'disabled':''}>${state.step===2?'确认合作名单':'生成合作材料'} →</button>`}</div>`;
if(state.step===1){$('#clearBtn').onclick=clearForm;$('#exampleBtn').onclick=()=>{state.form={...example};save();render()};$('#briefForm').oninput=()=>{state.form={...state.form,...readForm($('#briefForm'))};save()};$('#briefForm').onsubmit=e=>{e.preventDefault();const f=readForm(e.target);f.budget=Number(f.budget);if(!e.target.reportValidity()||!f.category||!f.goal||!f.format){return}if(!f.brand.trim()||!f.product.trim()||!f.selling.trim()||!Number.isFinite(f.budget)||f.budget<=0){toast('请补全品牌、产品、卖点与有效预算');return}state.form=f;const allowed=new Set(rank(f).map(c=>c.id));const prev=state.selected.length;state.selected=state.selected.filter(id=>allowed.has(id));if(state.signature!==JSON.stringify(f)){state.edits={};state.signature=JSON.stringify(f)}go(2);if(prev>state.selected.length)toast('已移除不符合新预算或品类的候选')};}
document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(Number(el.dataset.go)));document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{const id=el.dataset.toggle;if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else state.selected.push(id);state.edits={};save();const y=window.scrollY;render();window.scrollTo(0,y)});document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;render()});document.querySelectorAll('[data-edit]').forEach(el=>el.oninput=()=>{state.edits[el.dataset.edit]=el.value;save()});document.querySelectorAll('[data-copy]').forEach(el=>el.onclick=()=>copy(el.dataset.copy));if($('#creatorSelect'))$('#creatorSelect').onchange=e=>{state.activeCreator=e.target.value;render()};if($('#downloadBtn'))$('#downloadBtn').onclick=downloadAll;if($('#downloadAll'))$('#downloadAll').onclick=downloadAll;if($('#emailBtn'))$('#emailBtn').onclick=()=>openEmail('self');if($('#inviteBtn'))$('#inviteBtn').onclick=()=>openEmail('creator');}
async function copy(key){const el=document.querySelector(`[data-edit="${key}"]`);try{await navigator.clipboard.writeText(el.value);toast('已复制，可以粘贴到沟通工具')}catch{el.focus();el.select();try{if(document.execCommand('copy'))toast('已复制');else toast('已选中文本，请手动复制')}catch{toast('已选中文本，请手动复制')}}}
function materialText(){return ['仅用于 2027 校园招聘，未经许可不得用于其他用途。',state.edits.brief??briefText(),...selected().flatMap(c=>['\n---\n'+c.name,state.edits['en-'+c.id]??invitation(c,'en'),state.edits['zh-'+c.id]??invitation(c,'zh'),state.edits['external-'+c.id]??creatorBrief(c)])].join('\n\n')}

$('#aboutBtn').onclick=()=>{$('#modal').innerHTML=`<div class="panel"><div class="section-title"><h2>关于本演示</h2><button id="closeModal" aria-label="关闭说明">×</button></div><p>面向中国中小商家出海，当前只以美妆演示。未接入 TikTok One 或实时大模型，不属于小红书或 TikTok 官方产品。本演示使用虚构达人及示例报价。推荐根据填写的需求匹配；邮箱发送和达人邀约均为模拟，不会实际投递。</p><button id="resetBtn">清除本机草稿</button></div>`;$('#modal').classList.remove('hidden');$('#closeModal').onclick=closeModal;$('#resetBtn').onclick=()=>{if(confirm('清空后将移除当前需求、名单和材料。')){localStorage.removeItem('redhood-v2-en');location.reload()}};$('#closeModal').focus()};
function closeModal(){$('#modal').classList.add('hidden');render();($('#emailBtn')||$('#aboutBtn')).focus()}$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&!$('#modal').classList.contains('hidden')){const els=[...$('#modal').querySelectorAll('button,a,input,select,textarea,summary')];if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});

const emailDrafts={};let mockReceipt=null;const receipts=[];let mailMode='self';
function creatorBrief(c){return (state.edits.brief??briefText())+`\n\n## Creator-specific proposal\nCreator: ${c.name}\nDeliverable: one TikTok post\nIndicative creator fee: ${money(c.fee)} (fictional demo quote, subject to confirmation).\nExcludes samples, taxes, media spend and additional usage rights.`}
function openEmail(mode=mailMode,creatorId=state.activeCreator){
 mailMode=mode;const c=selected().find(x=>x.id===creatorId)||selected()[0];const key=mode==='self'?'self':c.id;
 const subject=mode==='self'?`${state.form.brand} · 合作材料`:`Collaboration proposal: ${english(state.form.brand,'brand name')} x ${c.name}`;

 $('#modal').classList.remove('hidden');$('#recipientEmail').focus();$('#closeEmail').onclick=closeModal;$('#cancelEmail').onclick=closeModal;

 };
}

 };
